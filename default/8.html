<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Universal 8 (Caleidoscópio Quântico & Mandala Fractal)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #030208;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Universal Default 8: Caleidoscópio Quântico & Mandala Fractal
     * 
     * Estilo: Geometria sagrada pura, caleidoscópio óptico de 12 eixos espelhados, curvas de Roseta e harmônicos polares.
     * Paleta: Índigo Quântico (#6366f1), Rosa Orquídea (#ec4899), Turquesa (#14b8a6),
     *         Dourado Solar (#facc15), Branco Puro (#ffffff), Fundo Vácuo (#030208).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // ✨ Cristais de Luz Flutuantes
    const NUM_CRYSTALS = 50;
    const crystals = Array.from({ length: NUM_CRYSTALS }, () => ({
      angle: Math.random() * Math.PI * 2,
      dist: Math.random() * 0.8 + 0.2,
      speed: (Math.random() - 0.5) * 0.01,
      size: Math.random() * 2.2 + 0.8,
      alpha: Math.random() * 0.6 + 0.3
    }));

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const minDim = Math.min(w, h);
      const mandalaR = minDim * 0.38;

      // 1. Limpeza suave
      ctx.fillStyle = 'rgba(3, 2, 8, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.014; // Ritmo hipnótico e contemplativo
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 2. Halo Quântico Central
      const pulse = isPlaying ? (1 + Math.sin(t * 1.8) * 0.08 + Math.cos(t * 3.2) * 0.03) : 1;
      const currentR = mandalaR * pulse;

      const qGlow = ctx.createRadialGradient(cx, cy, 5, cx, cy, currentR * 1.25);
      qGlow.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
      qGlow.addColorStop(0.25, 'rgba(236, 72, 153, 0.25)');
      qGlow.addColorStop(0.55, 'rgba(99, 102, 241, 0.12)');
      qGlow.addColorStop(0.85, 'rgba(20, 184, 166, 0.04)');
      qGlow.addColorStop(1, 'rgba(3, 2, 8, 0)');

      ctx.fillStyle = qGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, currentR * 1.25, 0, Math.PI * 2);
      ctx.fill();

      // 3. Caleidoscópio de 12 Eixos Espelhados
      const numSectors = 12;
      const sectorAngle = (Math.PI * 2) / numSectors;

      ctx.save();
      ctx.translate(cx, cy);

      for (let s = 0; s < numSectors; s++) {
        ctx.save();
        ctx.rotate(s * sectorAngle + (isPlaying ? t * 0.12 : 0));
        if (s % 2 === 1) ctx.scale(1, -1); // Espelhamento

        // Rosácea / Pétalas Geométricas
        const numPetals = 4;
        for (let p = 0; p < numPetals; p++) {
          const pR = currentR * (0.3 + p * 0.22);
          const pAngle = (p * 0.35) + (isPlaying ? Math.sin(t * 1.5 + p) * 0.1 : 0);
          const pAlpha = (0.45 - p * 0.08) * (isPlaying ? 1 : 0.4);

          const colors = [
            `rgba(236, 72, 153, ${pAlpha})`,
            `rgba(99, 102, 241, ${pAlpha})`,
            `rgba(20, 184, 166, ${pAlpha})`,
            `rgba(250, 204, 21, ${pAlpha})`
          ];

          ctx.strokeStyle = colors[p % colors.length];
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(0, 0);

          const c1x = Math.cos(pAngle) * (pR * 0.6);
          const c1y = Math.sin(pAngle) * (pR * 0.4);
          const c2x = Math.cos(pAngle + 0.2) * (pR * 0.9);
          const c2y = Math.sin(pAngle + 0.2) * (pR * 0.6);
          const endX = Math.cos(pAngle) * pR;
          const endY = Math.sin(pAngle) * pR;

          ctx.bezierCurveTo(c1x, c1y, c2x, c2y, endX, endY);
          ctx.stroke();

          // Nó de luz no ápice da curva
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(endX, endY, 2.0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      ctx.restore();

      // 4. Anéis Concêntricos de Ressonância e Proporção Áurea
      for (let r = 1; r <= 3; r++) {
        const ringRad = currentR * (0.35 * r);
        const ringAlpha = (0.35 - r * 0.08) * (isPlaying ? 1 : 0.4);

        ctx.strokeStyle = r % 2 === 0 ? `rgba(236, 72, 153, ${ringAlpha})` : `rgba(20, 184, 166, ${ringAlpha})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();

        const points = 72;
        for (let i = 0; i <= points; i++) {
          const theta = (i / points) * Math.PI * 2;
          const wave = isPlaying ? Math.sin(theta * (6 * r) + t * (r % 2 === 0 ? 2 : -2)) * 6 : 0;
          const rad = ringRad + wave;
          const px = cx + Math.cos(theta) * rad;
          const py = cy + Math.sin(theta) * rad;

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // 5. Núcleo Estelar Central (Flor da Vida)
      const coreR = currentR * 0.16;
      const gradCore = ctx.createRadialGradient(cx, cy, 1, cx, cy, coreR * 2.2);
      gradCore.addColorStop(0, '#ffffff');
      gradCore.addColorStop(0.3, '#facc15');
      gradCore.addColorStop(0.6, 'rgba(236, 72, 153, 0.7)');
      gradCore.addColorStop(1, 'rgba(3, 2, 8, 0)');

      ctx.fillStyle = gradCore;
      ctx.beginPath();
      ctx.arc(cx, cy, coreR * 2.2, 0, Math.PI * 2);
      ctx.fill();

      // 6. Cristais de Luz Flutuantes em Órbita
      crystals.forEach(cr => {
        if (isPlaying) {
          cr.angle += cr.speed;
        }

        const realDist = cr.dist * currentR;
        const x = cx + Math.cos(cr.angle) * realDist;
        const y = cy + Math.sin(cr.angle) * realDist;
        const alpha = cr.alpha * (isPlaying ? 1 : 0.4);

        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y, cr.size, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
