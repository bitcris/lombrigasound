<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Universal 10 (Reator de Fusão & Núcleo Tokamak)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #020810;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Universal Default 10: Reator de Fusão & Núcleo Tokamak
     * 
     * Estilo: Reator de fusão nuclear a plasma magnético, bobinas de confinamento toroidal em rotação,
     *         radiação Cherenkov e arcos de plasma de alta densidade.
     * Paleta: Azul Cherenkov (#0284c7), Ciano Plasma (#00f5ff), Laranja Fusão (#ff5500),
     *         Branco Supernova (#ffffff), Fundo Preto Reator (#020810).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // ⚛️ Partículas de Plasma Confinadas em Vórtice
    const NUM_PARTICLES = 60;
    const plasmaParticles = Array.from({ length: NUM_PARTICLES }, () => ({
      angle: Math.random() * Math.PI * 2,
      torusPhase: Math.random() * Math.PI * 2,
      speedAngle: Math.random() * 0.03 + 0.015,
      speedPhase: Math.random() * 0.05 + 0.02,
      size: Math.random() * 2.2 + 0.8,
      alpha: Math.random() * 0.6 + 0.3
    }));

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const minDim = Math.min(w, h);
      const coreR = minDim * 0.22;

      // 1. Limpeza com rastro suave
      ctx.fillStyle = 'rgba(2, 8, 16, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.018; // Ritmo de confinamento acelerado
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 2. Radiação Cherenkov & Brilho de Confinamento Magnético
      const pulse = isPlaying ? (1 + Math.sin(t * 2.5) * 0.08 + Math.cos(t * 4.2) * 0.04) : 1;
      const cherenkovR = minDim * 0.46 * pulse;

      const cherenkovGlow = ctx.createRadialGradient(cx, cy, 10, cx, cy, cherenkovR);
      cherenkovGlow.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
      cherenkovGlow.addColorStop(0.2, 'rgba(0, 245, 255, 0.35)');
      cherenkovGlow.addColorStop(0.55, 'rgba(2, 132, 199, 0.15)');
      cherenkovGlow.addColorStop(0.85, 'rgba(255, 85, 0, 0.04)');
      cherenkovGlow.addColorStop(1, 'rgba(2, 8, 16, 0)');

      ctx.fillStyle = cherenkovGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, cherenkovR, 0, Math.PI * 2);
      ctx.fill();

      // 3. Bobinas Magnéticas Toroidais em Rotação (Gimbal Coils 3D)
      const numCoils = 4;
      for (let c = 0; c < numCoils; c++) {
        const coilAngle = (c / numCoils) * Math.PI + (isPlaying ? t * 0.2 : 0);
        const coilR = coreR * (1.1 + c * 0.18) * pulse;
        const coilAlpha = (0.45 - c * 0.07) * (isPlaying ? 1 : 0.4);

        ctx.strokeStyle = c % 2 === 0 ? `rgba(0, 245, 255, ${coilAlpha})` : `rgba(255, 85, 0, ${coilAlpha * 0.9})`;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(cx, cy, coilR, coilR * 0.38, coilAngle, 0, Math.PI * 2);
        ctx.stroke();

        // Marcadores de campo magnético no anel
        for (let m = 0; m < 4; m++) {
          const theta = (m / 4) * Math.PI * 2 + (isPlaying ? t * 0.5 : 0);
          const x0 = Math.cos(theta) * coilR;
          const y0 = Math.sin(theta) * (coilR * 0.38);

          // Rotação do ponto
          const rx = cx + x0 * Math.cos(coilAngle) - y0 * Math.sin(coilAngle);
          const ry = cy + x0 * Math.sin(coilAngle) + y0 * Math.cos(coilAngle);

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(rx, ry, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 4. Toroide de Plasma Central (Núcleo de Fusão Incandescente)
      const numPlasmaStreams = 8;
      for (let s = 0; s < numPlasmaStreams; s++) {
        const streamPhase = (s / numPlasmaStreams) * Math.PI * 2;
        ctx.strokeStyle = s % 2 === 0 ? 'rgba(0, 245, 255, 0.7)' : 'rgba(255, 85, 0, 0.65)';
        ctx.lineWidth = 2.0;
        ctx.beginPath();

        const segments = 60;
        for (let i = 0; i <= segments; i++) {
          const phi = (i / segments) * Math.PI * 2;
          const majorR = coreR * 0.75 * pulse;
          const minorR = coreR * 0.28 * pulse;

          const theta = phi * 3 + (isPlaying ? t * 3 + streamPhase : streamPhase);
          const r = majorR + Math.cos(theta) * minorR;
          const px = cx + Math.cos(phi) * r;
          const py = cy + Math.sin(phi) * (r * 0.8) + Math.sin(theta) * (minorR * 0.6);

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // 5. Núcleo Supernova Central (Estrela Artificial)
      const starR = coreR * 0.32 * pulse;
      const gradStar = ctx.createRadialGradient(cx, cy, 2, cx, cy, starR * 2.5);
      gradStar.addColorStop(0, '#ffffff');
      gradStar.addColorStop(0.25, '#00f5ff');
      gradStar.addColorStop(0.6, 'rgba(255, 85, 0, 0.75)');
      gradStar.addColorStop(0.85, 'rgba(2, 132, 199, 0.25)');
      gradStar.addColorStop(1, 'rgba(2, 8, 16, 0)');

      ctx.fillStyle = gradStar;
      ctx.beginPath();
      ctx.arc(cx, cy, starR * 2.5, 0, Math.PI * 2);
      ctx.fill();

      // 6. Partículas de Plasma Confinadas em Alta Velocidade
      plasmaParticles.forEach(p => {
        if (isPlaying) {
          p.angle += p.speedAngle;
          p.torusPhase += p.speedPhase;
        }

        const majR = coreR * 0.85 * pulse;
        const minR = coreR * 0.35 * pulse;
        const r = majR + Math.cos(p.torusPhase) * minR;

        const x = cx + Math.cos(p.angle) * r;
        const y = cy + Math.sin(p.angle) * (r * 0.75) + Math.sin(p.torusPhase) * (minR * 0.5);

        const currentAlpha = p.alpha * (isPlaying ? 1 : 0.4);
        ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.size > 1.8) {
          ctx.fillStyle = `rgba(0, 245, 255, ${currentAlpha * 0.45})`;
          ctx.beginPath();
          ctx.arc(x, y, p.size * 2.4, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
