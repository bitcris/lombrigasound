<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Universal 7 (DNA Holográfico & Cyber Helix)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #010906;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Universal Default 7: DNA Holográfico & Cyber Helix
     * 
     * Estilo: Hélice dupla de DNA 3D holográfica em rotação, pontes de pares de bases em laser,
     *         anéis de telemetria bio-cibernética orbital e partículas de dados moleculares.
     * Paleta: Verde Neon (#22c55e), Ciano Cibernético (#06b6d4), Violeta Quântico (#8b5cf6),
     *         Branco Luz (#ffffff), Fundo Preto Cibernético (#010906).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // 🧬 Partículas de Dados Moleculares
    const NUM_DATA_NODES = 50;
    const dataNodes = Array.from({ length: NUM_DATA_NODES }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      speedY: Math.random() * 0.5 + 0.2,
      size: Math.random() * 2.2 + 0.8,
      alpha: Math.random() * 0.6 + 0.3,
      isGreen: Math.random() > 0.4
    }));

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const minDim = Math.min(w, h);
      const helixRadius = minDim * 0.16;

      // 1. Limpeza de rastro
      ctx.fillStyle = 'rgba(1, 9, 6, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.018; // Rotação bio-cibernética contínua
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 2. Halo de Ressonância Molecular
      const pulse = isPlaying ? (1 + Math.sin(t * 2) * 0.07 + Math.cos(t * 3.5) * 0.03) : 1;
      const haloR = minDim * 0.42 * pulse;

      const bioGlow = ctx.createRadialGradient(cx, cy, 10, cx, cy, haloR);
      bioGlow.addColorStop(0, 'rgba(34, 197, 94, 0.25)');
      bioGlow.addColorStop(0.4, 'rgba(6, 182, 212, 0.12)');
      bioGlow.addColorStop(0.8, 'rgba(139, 92, 246, 0.04)');
      bioGlow.addColorStop(1, 'rgba(1, 9, 6, 0)');

      ctx.fillStyle = bioGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, haloR, 0, Math.PI * 2);
      ctx.fill();

      // 3. Anéis de Telemetria Orbital Biométrica
      const numOrbits = 3;
      for (let o = 1; o <= numOrbits; o++) {
        const orbitR = minDim * (0.28 + o * 0.08) * pulse;
        const orbitRot = t * (o % 2 === 0 ? 0.15 : -0.12);
        
        ctx.strokeStyle = o === 1 ? 'rgba(6, 182, 212, 0.35)' : 'rgba(34, 197, 94, 0.25)';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([6, 12]);
        ctx.beginPath();
        ctx.arc(cx, cy, orbitR, orbitRot, orbitRot + Math.PI * 1.8);
        ctx.stroke();
        ctx.setLineDash([]);

        // Marcadores de nós na órbita
        for (let m = 0; m < 4; m++) {
          const mAngle = orbitRot + (m / 4) * Math.PI * 2;
          const mx = cx + Math.cos(mAngle) * orbitR;
          const my = cy + Math.sin(mAngle) * orbitR;

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(mx, my, 2.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 4. Hélice Dupla de DNA 3D Holográfico
      const numRungs = 28;
      const helixHeight = h * 0.85;
      const rungSpacing = helixHeight / numRungs;
      const startY = cy - helixHeight / 2;

      for (let i = 0; i < numRungs; i++) {
        const progress = i / numRungs;
        const y = startY + i * rungSpacing;

        const theta1 = (progress * Math.PI * 4) + t * 1.5;
        const theta2 = theta1 + Math.PI;

        const hr = helixRadius * (0.85 + Math.sin(progress * Math.PI) * 0.3) * pulse;

        // Projeção 3D dos dois polos
        const x1 = cx + Math.cos(theta1) * hr;
        const z1 = Math.sin(theta1) * hr;

        const x2 = cx + Math.cos(theta2) * hr;
        const z2 = Math.sin(theta2) * hr;

        // Escalas e profundidade baseadas em Z
        const alpha1 = Math.max(0.2, (z1 + hr) / (hr * 2)) * (isPlaying ? 1 : 0.4);
        const alpha2 = Math.max(0.2, (z2 + hr) / (hr * 2)) * (isPlaying ? 1 : 0.4);
        const nodeSize1 = (3.5 + (z1 / hr) * 2) * pulse;
        const nodeSize2 = (3.5 + (z2 / hr) * 2) * pulse;

        // Linha de Ligação do Par de Bases (Laser Link)
        const avgZ = (z1 + z2) / 2;
        const linkAlpha = (0.35 + Math.sin(t * 3 + i * 0.4) * 0.25) * (isPlaying ? 1 : 0.35);

        const linkGrad = ctx.createLinearGradient(x1, y, x2, y);
        linkGrad.addColorStop(0, `rgba(34, 197, 94, ${alpha1})`);
        linkGrad.addColorStop(0.5, `rgba(255, 255, 255, ${linkAlpha})`);
        linkGrad.addColorStop(1, `rgba(6, 182, 212, ${alpha2})`);

        ctx.strokeStyle = linkGrad;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();

        // Ponto de recombinação de laser no meio
        const midX = (x1 + x2) / 2;
        ctx.fillStyle = `rgba(255, 255, 255, ${linkAlpha * 1.2})`;
        ctx.beginPath();
        ctx.arc(midX, y, 2.0, 0, Math.PI * 2);
        ctx.fill();

        // Nó do filamento 1 (Verde Matrix)
        ctx.fillStyle = `rgba(34, 197, 94, ${alpha1})`;
        ctx.beginPath();
        ctx.arc(x1, y, nodeSize1, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255, 255, 255, ${alpha1 * 0.8})`;
        ctx.beginPath();
        ctx.arc(x1, y, nodeSize1 * 0.45, 0, Math.PI * 2);
        ctx.fill();

        // Nó do filamento 2 (Ciano Cibernético)
        ctx.fillStyle = `rgba(6, 182, 212, ${alpha2})`;
        ctx.beginPath();
        ctx.arc(x2, y, nodeSize2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255, 255, 255, ${alpha2 * 0.8})`;
        ctx.beginPath();
        ctx.arc(x2, y, nodeSize2 * 0.45, 0, Math.PI * 2);
        ctx.fill();
      }

      // 5. Partículas de Dados Moleculares em Fluxo
      dataNodes.forEach(p => {
        if (isPlaying) {
          p.y -= p.speedY;
          if (p.y < 0) {
            p.y = h;
            p.x = Math.random() * w;
          }
        }

        const alpha = p.alpha * (isPlaying ? 1 : 0.4);
        ctx.fillStyle = p.isGreen ? `rgba(34, 197, 94, ${alpha})` : `rgba(6, 182, 212, ${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
