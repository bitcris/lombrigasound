<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Universal 2 (PS2 Soundscape & Pilares Místicos)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #02040a;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Universal Default 2: PS2 Soundscape & Pilares Místicos
     * 
     * Estilo: Inspirado na tela mística de áudio e boot do PlayStation 2 com pilares translúcidos flutuantes e orbes orbitais.
     * Paleta: Névoa azul meia-noite (#020617, #0f172a), Ciano etéreo (#06b6d4, #38bdf8), Luz prateada (#ffffff).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let genre = 'default';
    let audioData = null;

    function getHashTheme(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      const h = Math.abs(hash) % 360;
      return {
        primary: `hsl(${h}, 85%, 60%)`,
        secondary: `hsl(${(h + 45) % 360}, 90%, 65%)`,
        glow: `hsl(${(h + 90) % 360}, 80%, 55%)`
      };
    }

    const THEMES = {
      default:   { primary: '#38bdf8', secondary: '#818cf8', glow: '#06b6d4' },
      synthwave: { primary: '#ff007f', secondary: '#00f0ff', glow: '#a855f7' },
      rock:      { primary: '#ff3b00', secondary: '#f59e0b', glow: '#ef4444' },
      gospel:    { primary: '#fbbf24', secondary: '#ffffff', glow: '#f59e0b' },
      country:   { primary: '#d97706', secondary: '#fde047', glow: '#ea580c' },
      news:      { primary: '#ef4444', secondary: '#38bdf8', glow: '#1d4ed8' }
    };

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);

      const rawGenre = e.data.genre || e.data.genere;
      if (rawGenre && typeof rawGenre === 'string') {
        genre = rawGenre.toLowerCase().trim();
      }
      if (e.data.audioData && Array.isArray(e.data.audioData)) {
        audioData = e.data.audioData;
      }
    });

    // 🏛️ Pilares de Dados Monolíticos (Estilo PS2)
    const NUM_PILLARS = 14;
    const pillars = Array.from({ length: NUM_PILLARS }, (_, i) => ({
      angle: (i / NUM_PILLARS) * Math.PI * 2,
      baseH: 90 + (i % 4) * 40,
      widthFactor: 24,
      phase: i * 0.45
    }));

    // 🔮 Orbes Espirituais em Órbita 3D
    const NUM_ORBS = 7;
    const orbs = Array.from({ length: NUM_ORBS }, (_, i) => ({
      angle: (i / NUM_ORBS) * Math.PI * 2,
      speed: 0.008 + (i % 3) * 0.004,
      radX: 0.35 + (i % 2) * 0.1,
      radY: 0.12 + (i % 2) * 0.05,
      yOffset: (Math.random() - 0.5) * 60,
      size: Math.random() * 3 + 2.5
    }));

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h * 0.52;
      const minDim = Math.min(w, h);

      const theme = THEMES[genre] || getHashTheme(genre);

      // 1. Limpeza de fundo com névoa volumétrica suave
      ctx.fillStyle = 'rgba(2, 4, 10, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.015; // Velocidade lenta e hipnótica
      }

      ctx.save();

      // 2. Névoa de Chão Volumétrica (Atmosphere Glow)
      ctx.globalCompositeOperation = 'screen';
      const fogGrad = ctx.createRadialGradient(cx, cy + 50, 10, cx, cy + 50, minDim * 0.65);
      fogGrad.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
      fogGrad.addColorStop(0.4, 'rgba(15, 23, 42, 0.12)');
      fogGrad.addColorStop(1, 'rgba(2, 4, 10, 0)');

      ctx.fillStyle = fogGrad;
      ctx.fillRect(0, 0, w, h);

      // 3. Renderização dos Pilares em Anel 3D Monolítico
      const pillarRingRadX = minDim * 0.38;
      const pillarRingRadY = minDim * 0.14;

      // Ordenar pilares por profundidade (Z)
      const sortedPillars = pillars.map(p => {
        const effAngle = p.angle + (isPlaying ? t * 0.12 : 0);
        const px = cx + Math.cos(effAngle) * pillarRingRadX;
        const py = cy + Math.sin(effAngle) * pillarRingRadY;
        const depth = Math.sin(effAngle); // -1 (fundo) a +1 (frente)
        return { ...p, effAngle, px, py, depth };
      }).sort((a, b) => a.depth - b.depth);

      sortedPillars.forEach(p => {
        const scale = 0.75 + (p.depth + 1) * 0.25; // 0.75 a 1.25
        const pWidth = p.widthFactor * scale;
        
        // Pulsação suave da altura do pilar
        const wave = isPlaying ? Math.sin(t * 2.5 + p.phase) * 35 : 0;
        const pHeight = (p.baseH + wave) * scale;
        const topY = p.py - pHeight;

        const alpha = (0.25 + (p.depth + 1) * 0.35) * (isPlaying ? 1 : 0.4);

        // Corpo do pilar (gradiente translúcido)
        const pGrad = ctx.createLinearGradient(p.px, topY, p.px, p.py);
        pGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 1.3})`);
        pGrad.addColorStop(0.2, theme.primary);
        pGrad.addColorStop(0.7, theme.secondary);
        pGrad.addColorStop(1, 'rgba(2, 4, 10, 0)');

        ctx.fillStyle = pGrad;
        ctx.fillRect(p.px - pWidth / 2, topY, pWidth, pHeight);

        // Borda iluminada do pilar
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
        ctx.lineWidth = 1.2;
        ctx.strokeRect(p.px - pWidth / 2, topY, pWidth, pHeight);

        // Brilho no topo do pilar
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.px, topY, 2.5 * scale, 0, Math.PI * 2);
        ctx.fill();
      });

      // 4. Orbes Místicos em Órbita Suave (PlayStation Spirit Orbs)
      orbs.forEach(orb => {
        if (isPlaying) {
          orb.angle += orb.speed;
        }

        const ox = cx + Math.cos(orb.angle) * (minDim * orb.radX);
        const oy = cy + Math.sin(orb.angle) * (minDim * orb.radY) + orb.yOffset;
        const depth = Math.sin(orb.angle);
        const scale = 0.8 + (depth + 1) * 0.3;

        // Aura do orbe
        const orbAura = ctx.createRadialGradient(ox, oy, 1, ox, oy, orb.size * 5 * scale);
        orbAura.addColorStop(0, '#ffffff');
        orbAura.addColorStop(0.3, theme.primary);
        orbAura.addColorStop(0.7, theme.glow);
        orbAura.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = orbAura;
        ctx.beginPath();
        ctx.arc(ox, oy, orb.size * 5 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Núcleo branco sólido
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ox, oy, orb.size * scale, 0, Math.PI * 2);
        ctx.fill();
      });

      // 5. Anel de Ressonância Central Flutuante
      ctx.strokeStyle = `rgba(255, 255, 255, ${isPlaying ? 0.4 : 0.15})`;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(cx, cy, pillarRingRadX * 1.15, pillarRingRadY * 1.15, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
