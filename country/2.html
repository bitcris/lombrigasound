<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Country 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0a06; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = true;
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
    });

    let t = 0;

    function render() {
      ctx.fillStyle = 'rgba(15, 10, 6, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isPlaying) t += 0.035;

      const w = canvas.width;
      const h = canvas.height;
      const centerY = h * 0.5;

      const ribbons = [
        { color: '#f59e0b', freq: 0.005, speed: 1.0, amp: 50 },
        { color: '#d97706', freq: 0.008, speed: 1.3, amp: 40 },
        { color: '#b45309', freq: 0.003, speed: 0.7, amp: 60 }
      ];

      ribbons.forEach(ribbon => {
        ctx.strokeStyle = ribbon.color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let x = 0; x < w; x += 8) {
          const y = centerY + Math.sin(t * ribbon.speed + x * ribbon.freq) * (isPlaying ? ribbon.amp : 5);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      });

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
