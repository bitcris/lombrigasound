<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Rock 2 (Tempestade de Raios & Palheta Elétrica)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #02040a;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Rock 2: Tempestade de Raios & Palheta Elétrica
     * 
     * Tema: Heavy Metal / Hard Rock, palheta cromada central, raios ramificados de alta tensão
     *       e anel osciloscópico de distorção com espinhos elétricos.
     * Paleta: Azul Elétrico (#00d4ff), Roxo Raios (#9333ea), Ciano Neon (#38bdf8),
     *         Branco Plasma (#ffffff), Preto Profundo (#02040a).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // ⚡ Partículas Ionizadas em Órbita
    const NUM_IONS = 60;
    const ions = Array.from({ length: NUM_IONS }, () => ({
      angle: Math.random() * Math.PI * 2,
      radiusFactor: Math.random() * 0.4 + 0.8,
      speed: (Math.random() * 0.04 + 0.02) * (Math.random() > 0.5 ? 1 : -1),
      size: Math.random() * 2.2 + 0.8,
      alpha: Math.random() * 0.6 + 0.3
    }));

    // Função de geração de raio procedural
    function drawLightning(x1, y1, x2, y2, displace, depth) {
      if (depth === 0) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        return;
      }

      const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * displace;
      const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * displace;

      drawLightning(x1, y1, midX, midY, displace / 1.8, depth - 1);
      drawLightning(midX, midY, x2, y2, displace / 1.8, depth - 1);

      // Ramificação secundária ocasional
      if (depth >= 2 && Math.random() > 0.65) {
        const branchX = midX + (Math.random() - 0.5) * displace * 1.5;
        const branchY = midY + (Math.random() - 0.5) * displace * 1.5;
        drawLightning(midX, midY, branchX, branchY, displace / 2.2, depth - 1);
      }
    }

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const minDim = Math.min(w, h);
      const baseRadius = minDim * 0.24;

      // 1. Limpeza suave
      ctx.fillStyle = 'rgba(2, 4, 10, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.022; // Ritmo elétrico acelerado
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 2. Halo de Alta Tensão Elétrica
      const pulse = isPlaying ? (1 + Math.sin(t * 3.5) * 0.08 + Math.cos(t * 6.0) * 0.04) : 1;
      const haloR = minDim * 0.44 * pulse;

      const electricGlow = ctx.createRadialGradient(cx, cy, 10, cx, cy, haloR);
      electricGlow.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
      electricGlow.addColorStop(0.2, 'rgba(0, 212, 255, 0.35)');
      electricGlow.addColorStop(0.5, 'rgba(147, 51, 234, 0.15)');
      electricGlow.addColorStop(0.8, 'rgba(56, 189, 248, 0.04)');
      electricGlow.addColorStop(1, 'rgba(2, 4, 10, 0)');

      ctx.fillStyle = electricGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, haloR, 0, Math.PI * 2);
      ctx.fill();

      // 3. Anel de Espinhos Osciloscópicos de Distorção (Guitar Riff Wave)
      const numPoints = 80;
      ctx.strokeStyle = '#00d4ff';
      ctx.lineWidth = 2.4;
      ctx.beginPath();

      for (let i = 0; i <= numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const harmonic1 = isPlaying ? Math.sin(angle * 12 + t * 4) * 22 : 0;
        const harmonic2 = isPlaying ? Math.cos(angle * 24 - t * 6) * 12 : 0;
        const spike = isPlaying ? (Math.pow(Math.sin(angle * 6 + t * 2), 3) * 35) : 0;
        const r = (baseRadius * pulse) + harmonic1 + harmonic2 + spike;

        const px = cx + Math.cos(angle) * r;
        const py = cy + Math.sin(angle) * r;

        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();

      // Anel secundário em tom Roxo Elétrico
      ctx.strokeStyle = 'rgba(147, 51, 234, 0.6)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let i = 0; i <= numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const wave = isPlaying ? Math.sin(angle * 8 - t * 3) * 15 : 0;
        const r = (baseRadius * 1.25 * pulse) + wave;
        const px = cx + Math.cos(angle) * r;
        const py = cy + Math.sin(angle) * r;

        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();

      // 4. Descargas de Raios Ramificados do Centro para o Anel
      if (isPlaying && Math.random() > 0.25) {
        const numBolts = Math.floor(Math.random() * 4) + 2;
        for (let b = 0; b < numBolts; b++) {
          const boltAngle = Math.random() * Math.PI * 2;
          const targetDist = baseRadius * (1.1 + Math.random() * 0.4) * pulse;
          const tx = cx + Math.cos(boltAngle) * targetDist;
          const ty = cy + Math.sin(boltAngle) * targetDist;

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.lineWidth = 2.0;
          drawLightning(cx, cy, tx, ty, 35, 4);

          ctx.strokeStyle = 'rgba(0, 212, 255, 0.45)';
          ctx.lineWidth = 5.0;
          drawLightning(cx, cy, tx, ty, 35, 4);
        }
      }

      // 5. Palheta de Guitarra Cósmica Central (Guitar Pick Cromada)
      const pickSize = minDim * 0.09 * pulse;
      const rotPick = Math.sin(t * 1.5) * 0.1;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotPick);

      // Forma da Palheta
      ctx.beginPath();
      ctx.moveTo(0, -pickSize * 1.1);
      ctx.bezierCurveTo(pickSize * 1.2, -pickSize * 0.9, pickSize * 1.1, pickSize * 0.7, 0, pickSize * 1.3);
      ctx.bezierCurveTo(-pickSize * 1.1, pickSize * 0.7, -pickSize * 1.2, -pickSize * 0.9, 0, -pickSize * 1.1);
      ctx.closePath();

      // Gradiente Cromado / Metálico da Palheta
      const pickGrad = ctx.createLinearGradient(-pickSize, -pickSize, pickSize, pickSize);
      pickGrad.addColorStop(0, '#ffffff');
      pickGrad.addColorStop(0.3, '#38bdf8');
      pickGrad.addColorStop(0.6, '#9333ea');
      pickGrad.addColorStop(1, '#00d4ff');

      ctx.fillStyle = pickGrad;
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.4;
      ctx.stroke();

      // Símbolo de Alta Tensão / Raio no centro da Palheta
      const boltScale = pickSize * 0.45;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(boltScale * 0.2, -boltScale);
      ctx.lineTo(-boltScale * 0.6, boltScale * 0.1);
      ctx.lineTo(boltScale * 0.1, boltScale * 0.1);
      ctx.lineTo(-boltScale * 0.2, boltScale * 1.1);
      ctx.lineTo(boltScale * 0.6, -boltScale * 0.1);
      ctx.lineTo(-boltScale * 0.1, -boltScale * 0.1);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // 6. Partículas Ionizadas em Órbita Ciclônica
      ions.forEach(ion => {
        if (isPlaying) {
          ion.angle += ion.speed;
        }

        const ir = (baseRadius * ion.radiusFactor) * pulse;
        const ix = cx + Math.cos(ion.angle) * ir;
        const iy = cy + Math.sin(ion.angle) * ir;

        const currentAlpha = ion.alpha * (isPlaying ? 1 : 0.4);
        ctx.fillStyle = `rgba(0, 212, 255, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(ix, iy, ion.size, 0, Math.PI * 2);
        ctx.fill();

        if (ion.size > 1.8) {
          ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha * 0.5})`;
          ctx.beginPath();
          ctx.arc(ix, iy, ion.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
