<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Rock 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050507; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = true;
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
    });

    let t = 0;
    const NUM_POINTS = 64;

    function render() {
      ctx.fillStyle = 'rgba(5, 5, 7, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isPlaying) t += 0.09;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const baseRadius = Math.min(canvas.width, canvas.height) * 0.25;

      // Anel de Espinhos Elétricos
      ctx.strokeStyle = '#ff3b00';
      ctx.lineWidth = 3;
      ctx.beginPath();

      for (let i = 0; i <= NUM_POINTS; i++) {
        const angle = (i / NUM_POINTS) * Math.PI * 2;
        const spike = isPlaying ? (Math.sin(t * 3 + i * 5) * Math.cos(t * 2 + i * 2) * 45) : 0;
        const r = baseRadius + spike;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();

      // Círculo central com flash
      const flash = isPlaying ? (Math.sin(t * 5) * 10) : 0;
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.arc(cx, cy, 25 + flash, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
