<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Rock 1 (Equalizador de Alta Voltagem & Parede de Amps)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #050202;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Rock 1: Equalizador de Alta Voltagem & Parede de Amps
     * 
     * Tema: Parede de amplificadores valvulados, equalizador de plasma em alta voltagem,
     *       arcos elétricos entre picos e shockwaves de bumbo.
     * Paleta: Laranja Elétrico (#ff6b00), Amarelo Chamas (#ffcc00), Vermelho Fogo (#dc2626),
     *         Branco Incandescente (#ffffff), Fundo Preto Ébano (#050202).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // 💥 Brasas e Faíscas de Palco
    const NUM_SPARKS = 55;
    const sparks = Array.from({ length: NUM_SPARKS }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2.5 + 0.8,
      speedY: Math.random() * 0.7 + 0.3,
      speedX: (Math.random() - 0.5) * 0.6,
      alpha: Math.random() * 0.6 + 0.3,
      isFire: Math.random() > 0.3
    }));

    // Picos com gravidade para as barras do EQ
    const NUM_BARS = 44;
    const peakCaps = Array(NUM_BARS).fill(0);
    const peakVelocity = Array(NUM_BARS).fill(0);

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h * 0.55;
      const minDim = Math.min(w, h);

      // 1. Limpeza de rastro
      ctx.fillStyle = 'rgba(5, 2, 2, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.02; // Ritmo enérgico e pulsante do Rock
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 2. Shockwave de Kick Drum no Centro (Onda de Impacto do Bumbo)
      const kickPulse = isPlaying ? Math.pow(Math.max(0, Math.sin(t * 2.8)), 4) : 0;
      const kickRadius = (minDim * 0.15) + kickPulse * (minDim * 0.25);
      const kickAlpha = kickPulse * 0.45;

      if (kickPulse > 0.05) {
        ctx.strokeStyle = `rgba(255, 107, 0, ${kickAlpha})`;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(cx, cy, kickRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = `rgba(255, 204, 0, ${kickAlpha * 0.8})`;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(cx, cy, kickRadius * 0.75, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Glow de Fundo Quente
      const bgGlow = ctx.createRadialGradient(cx, cy, 10, cx, cy, minDim * 0.55);
      bgGlow.addColorStop(0, `rgba(255, 107, 0, ${0.12 + kickPulse * 0.15})`);
      bgGlow.addColorStop(0.5, 'rgba(220, 38, 38, 0.06)');
      bgGlow.addColorStop(1, 'rgba(5, 2, 2, 0)');
      ctx.fillStyle = bgGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, minDim * 0.55, 0, Math.PI * 2);
      ctx.fill();

      // 3. Equalizador Gráfico Estéreo de Alta Voltagem
      const totalEqWidth = Math.min(w * 0.88, 920);
      const barSpacing = totalEqWidth / NUM_BARS;
      const barW = barSpacing * 0.72;
      const startX = (w - totalEqWidth) / 2;
      const maxBarH = h * 0.38;

      const highPeakPoints = [];

      for (let i = 0; i < NUM_BARS; i++) {
        const centerDist = Math.abs(i - NUM_BARS / 2) / (NUM_BARS / 2);
        const freqWeight = Math.sin((i / NUM_BARS) * Math.PI);

        // Dinâmica musical com bumbo, caixa e guitarras
        const bass = Math.pow(Math.max(0, Math.sin(t * 2.8 + i * 0.1)), 3) * 0.5;
        const rhythm = Math.abs(Math.sin(t * 4.5 + i * 0.35)) * 0.35;
        const guitarHarmonic = Math.abs(Math.cos(t * 7.2 - i * 0.5)) * 0.25;

        const currentVal = isPlaying 
          ? Math.min(1, (bass + rhythm + guitarHarmonic) * freqWeight * 1.35 + 0.05)
          : 0.04;

        const barH = currentVal * maxBarH;

        // Física dos Peak Caps (Marcadores de Pico que caem com gravidade)
        if (barH > peakCaps[i]) {
          peakCaps[i] = barH;
          peakVelocity[i] = 0;
        } else if (isPlaying) {
          peakVelocity[i] += 0.45; // Gravidade
          peakCaps[i] = Math.max(0, peakCaps[i] - peakVelocity[i]);
        }

        const bx = startX + i * barSpacing + (barSpacing - barW) / 2;
        const by = cy + (h * 0.18) - barH;

        // Barra de LED Segmentada
        const numSegments = 16;
        const segH = barH / numSegments;

        for (let s = 0; s < numSegments; s++) {
          const segProgress = s / numSegments;
          const sy = cy + (h * 0.18) - (s + 1) * segH;

          // Gradiente de cores: Base Laranja, Meio Amarelo, Topo Branco Incandescente
          let segColor;
          if (segProgress > 0.8) segColor = 'rgba(255, 255, 255, 0.95)';
          else if (segProgress > 0.5) segColor = 'rgba(255, 204, 0, 0.85)';
          else if (segProgress > 0.2) segColor = 'rgba(255, 107, 0, 0.75)';
          else segColor = 'rgba(220, 38, 38, 0.65)';

          ctx.fillStyle = segColor;
          ctx.fillRect(bx, sy, barW, Math.max(1, segH - 2));
        }

        // Desenhar Cap de Pico
        const capY = cy + (h * 0.18) - peakCaps[i];
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx, capY - 2, barW, 2.5);

        // Rastro de espelho invertido na base (Reflexo do Palco)
        const mirrorH = barH * 0.35;
        const mirrorGrad = ctx.createLinearGradient(0, cy + h * 0.18, 0, cy + h * 0.18 + mirrorH);
        mirrorGrad.addColorStop(0, 'rgba(255, 107, 0, 0.25)');
        mirrorGrad.addColorStop(1, 'rgba(5, 2, 2, 0)');
        ctx.fillStyle = mirrorGrad;
        ctx.fillRect(bx, cy + h * 0.18 + 2, barW, mirrorH);

        // Guardar pontos altos para arcos elétricos
        if (peakCaps[i] > maxBarH * 0.55) {
          highPeakPoints.push({ x: bx + barW / 2, y: capY });
        }
      }

      // 4. Arcos Elétricos de Alta Tensão entre Picos Altos
      if (isPlaying && highPeakPoints.length >= 2) {
        for (let p = 0; p < highPeakPoints.length - 1; p++) {
          if (Math.random() > 0.35) {
            const p1 = highPeakPoints[p];
            const p2 = highPeakPoints[p + 1];

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);

            const midX = (p1.x + p2.x) / 2;
            const midY = Math.min(p1.y, p2.y) - (Math.random() * 25 + 5);
            ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
            ctx.stroke();

            // Halo elétrico laranja em volta do arco
            ctx.strokeStyle = 'rgba(255, 107, 0, 0.4)';
            ctx.lineWidth = 4.5;
            ctx.stroke();
          }
        }
      }

      // 5. Linha de Chão de Palco Iluminada
      const groundY = cy + h * 0.18;
      const groundGrad = ctx.createLinearGradient(startX, groundY, startX + totalEqWidth, groundY);
      groundGrad.addColorStop(0, 'rgba(220, 38, 38, 0)');
      groundGrad.addColorStop(0.2, 'rgba(255, 107, 0, 0.8)');
      groundGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.95)');
      groundGrad.addColorStop(0.8, 'rgba(255, 107, 0, 0.8)');
      groundGrad.addColorStop(1, 'rgba(220, 38, 38, 0)');

      ctx.strokeStyle = groundGrad;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(w, groundY);
      ctx.stroke();

      // 6. Faíscas e Brasas de Palco Ascendentes
      sparks.forEach(p => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.x += p.speedX + Math.sin(t * 2 + p.y * 0.02) * 0.3;
          if (p.y < -15) {
            p.y = h + 15;
            p.x = Math.random() * w;
          }
        }

        const currentAlpha = p.alpha * (isPlaying ? 1 : 0.4);
        ctx.fillStyle = p.isFire 
          ? `rgba(255, 107, 0, ${currentAlpha})` 
          : `rgba(255, 255, 255, ${currentAlpha})`;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.size > 2.0) {
          ctx.fillStyle = `rgba(220, 38, 38, ${currentAlpha * 0.35})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
