<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Rock 3 (Pirotecnia de Palco & Anel de Fogo)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #080204;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Rock 3: Pirotecnia de Palco & Anel de Fogo
     * 
     * Tema: Show de estádio, pirotecnia e labaredas de chamas ao vivo,
     *       anel de fogo harmônico e canhões de holofotes de arena.
     * Paleta: Rubi Carmesim (#e11d48), Laranja Fogo (#f97316), Dourado Incandescente (#fbbf24),
     *         Branco Fogo (#ffffff), Fundo Preto Carvão (#080204).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // 🔥 Partículas de Chamas Vivas da Base
    const NUM_FLAMES = 60;
    const flameParticles = Array.from({ length: NUM_FLAMES }, () => ({
      x: Math.random() * window.innerWidth,
      y: window.innerHeight + Math.random() * 50,
      size: Math.random() * 25 + 10,
      speedY: Math.random() * 4 + 2,
      speedX: (Math.random() - 0.5) * 2,
      life: Math.random(),
      maxLife: Math.random() * 0.5 + 0.5
    }));

    // ✨ Brasas e Cinzas Incandescentes Flutuantes
    const NUM_EMBERS = 50;
    const embers = Array.from({ length: NUM_EMBERS }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2.5 + 0.8,
      speedY: Math.random() * 0.8 + 0.3,
      driftPhase: Math.random() * Math.PI * 2,
      alpha: Math.random() * 0.6 + 0.3
    }));

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h * 0.44;
      const minDim = Math.min(w, h);
      const ringRadius = minDim * 0.22;

      // 1. Limpeza com rastro escuro
      ctx.fillStyle = 'rgba(8, 2, 4, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.02; // Ritmo pesado e dinâmico
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 2. Canhões de Holofotes de Estádio (Arena Spotlights)
      const numLights = 6;
      for (let i = 0; i < numLights; i++) {
        const spotProg = (i - (numLights - 1) / 2) / ((numLights - 1) / 2);
        const originX = cx + spotProg * (w * 0.4);
        const originY = -40;
        const sweep = isPlaying ? Math.sin(t * 1.6 + i * 0.8) * 0.35 : spotProg * 0.2;
        const targetX = cx + Math.sin(sweep) * (h * 1.2);
        const targetY = h + 100;
        const spotWidth = minDim * 0.18;

        const spotGrad = ctx.createLinearGradient(originX, originY, targetX, targetY);
        spotGrad.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
        spotGrad.addColorStop(0.3, 'rgba(249, 115, 22, 0.18)');
        spotGrad.addColorStop(0.7, 'rgba(225, 29, 72, 0.08)');
        spotGrad.addColorStop(1, 'rgba(8, 2, 4, 0)');

        ctx.fillStyle = spotGrad;
        ctx.beginPath();
        ctx.moveTo(originX - 10, originY);
        ctx.lineTo(originX + 10, originY);
        ctx.lineTo(targetX + spotWidth, targetY);
        ctx.lineTo(targetX - spotWidth, targetY);
        ctx.closePath();
        ctx.fill();
      }

      // 3. Halo Quente da Arena
      const pulse = isPlaying ? (1 + Math.sin(t * 3) * 0.08 + Math.cos(t * 5.2) * 0.04) : 1;
      const haloR = minDim * 0.42 * pulse;

      const fireGlow = ctx.createRadialGradient(cx, cy, 5, cx, cy, haloR);
      fireGlow.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
      fireGlow.addColorStop(0.2, 'rgba(251, 191, 36, 0.4)');
      fireGlow.addColorStop(0.5, 'rgba(249, 115, 22, 0.18)');
      fireGlow.addColorStop(0.8, 'rgba(225, 29, 72, 0.05)');
      fireGlow.addColorStop(1, 'rgba(8, 2, 4, 0)');

      ctx.fillStyle = fireGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, haloR, 0, Math.PI * 2);
      ctx.fill();

      // 4. Anel de Fogo Central Rotativo (Harmonic Fire Ring)
      const numFlamesRing = 32;
      const rotRing = t * 0.7;

      ctx.strokeStyle = '#f97316';
      ctx.lineWidth = 2.4;
      ctx.beginPath();

      for (let i = 0; i <= numFlamesRing; i++) {
        const theta = (i / numFlamesRing) * Math.PI * 2 + (isPlaying ? rotRing : 0);
        const flameHeight = isPlaying ? (Math.sin(theta * 6 + t * 4) * 20 + Math.cos(theta * 12 - t * 6) * 12) : 5;
        const r = (ringRadius * pulse) + flameHeight;
        const px = cx + Math.cos(theta) * r;
        const py = cy + Math.sin(theta) * r;

        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();

      // Anel Interno Dourado Incandescente
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.85)';
      ctx.lineWidth = 2.0;
      ctx.beginPath();
      ctx.arc(cx, cy, ringRadius * 0.85 * pulse, 0, Math.PI * 2);
      ctx.stroke();

      // Labaredas Triangulares do Anel
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2 + (isPlaying ? -rotRing * 0.8 : 0);
        const innerR = ringRadius * 0.75 * pulse;
        const outerR = ringRadius * (1.3 + (isPlaying ? Math.sin(t * 4 + i) * 0.2 : 0)) * pulse;

        const x1 = cx + Math.cos(angle - 0.12) * innerR;
        const y1 = cy + Math.sin(angle - 0.12) * innerR;
        const x2 = cx + Math.cos(angle + 0.12) * innerR;
        const y2 = cy + Math.sin(angle + 0.12) * innerR;
        const tipX = cx + Math.cos(angle) * outerR;
        const tipY = cy + Math.sin(angle) * outerR;

        const flameGrad = ctx.createLinearGradient(cx, cy, tipX, tipY);
        flameGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        flameGrad.addColorStop(0.4, 'rgba(251, 191, 36, 0.6)');
        flameGrad.addColorStop(0.8, 'rgba(225, 29, 72, 0.3)');
        flameGrad.addColorStop(1, 'rgba(8, 2, 4, 0)');

        ctx.fillStyle = flameGrad;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(tipX, tipY);
        ctx.lineTo(x2, y2);
        ctx.closePath();
        ctx.fill();
      }

      // Núcleo de Plasma no Centro
      const coreR = ringRadius * 0.35 * pulse;
      const gradCore = ctx.createRadialGradient(cx, cy, 2, cx, cy, coreR);
      gradCore.addColorStop(0, '#ffffff');
      gradCore.addColorStop(0.3, '#fbbf24');
      gradCore.addColorStop(0.7, '#f97316');
      gradCore.addColorStop(1, 'rgba(225, 29, 72, 0)');

      ctx.fillStyle = gradCore;
      ctx.beginPath();
      ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
      ctx.fill();

      // 5. Chamas Vivas da Base do Palco
      flameParticles.forEach(p => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.x += p.speedX;
          p.life += 0.02;

          if (p.life >= p.maxLife || p.y < h * 0.65) {
            p.y = h + 10;
            p.x = Math.random() * w;
            p.life = 0;
            p.maxLife = Math.random() * 0.5 + 0.5;
          }
        }

        const lifeFactor = 1 - (p.life / p.maxLife);
        const currentSize = p.size * lifeFactor;
        const alpha = Math.sin(lifeFactor * Math.PI) * (isPlaying ? 0.7 : 0.3);

        const pGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, currentSize);
        pGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
        pGrad.addColorStop(0.3, `rgba(251, 191, 36, ${alpha * 0.8})`);
        pGrad.addColorStop(0.7, `rgba(249, 115, 22, ${alpha * 0.5})`);
        pGrad.addColorStop(1, 'rgba(225, 29, 72, 0)');

        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, currentSize, 0, Math.PI * 2);
        ctx.fill();
      });

      // 6. Brasas e Faíscas de Pirotecnia
      embers.forEach(p => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.x += Math.sin(t * 2 + p.driftPhase) * 0.5;
          if (p.y < -15) {
            p.y = h + 15;
            p.x = Math.random() * w;
          }
        }

        const currentAlpha = p.alpha * (isPlaying ? 1 : 0.4);
        ctx.fillStyle = `rgba(251, 191, 36, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.size > 2.0) {
          ctx.fillStyle = `rgba(225, 29, 72, ${currentAlpha * 0.4})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
