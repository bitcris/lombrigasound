<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Gospel 3 (Árvore da Vida & Éden Celestial)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #010c06;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Gospel 3: Árvore da Vida & Éden Celestial
     * 
     * Tema: A Árvore da Vida, a renovação espiritual e a promessa da vida eterna.
     * Paleta: Verde Esmeralda (#10b981), Jade Sagrado (#059669), Menta Luminosa (#34d399),
     *         Ouro-Lima Celestial (#bef264), Branco Puro (#ffffff), Fundo Negro Éden (#010c06).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // 🌿 Esporos de Vida & Vaga-lumes Sagrados
    const NUM_FIREFLIES = 55;
    const fireflies = Array.from({ length: NUM_FIREFLIES }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 2.2 + 0.8,
      speedY: Math.random() * 0.4 + 0.15,
      wobbleSpeed: Math.random() * 0.02 + 0.01,
      phase: Math.random() * Math.PI * 2,
      baseAlpha: Math.random() * 0.6 + 0.3,
      isGoldLime: Math.random() > 0.5
    }));

    let t = 0;

    // 🌳 Função Recursiva da Árvore Fractal de Luz
    function drawFractalBranch(startX, startY, length, angle, depth, maxDepth, pulse) {
      if (depth > maxDepth) return;

      const endX = startX + Math.cos(angle) * length;
      const endY = startY + Math.sin(angle) * length;

      const progress = depth / maxDepth;
      const lineWidth = Math.max(1.2, (maxDepth - depth + 1) * 1.5 * (depth <= 2 ? 1.4 : 1));

      // Gradiente luminoso do galho
      const branchGrad = ctx.createLinearGradient(startX, startY, endX, endY);
      if (depth <= 2) {
        branchGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        branchGrad.addColorStop(0.5, 'rgba(52, 211, 153, 0.7)');
        branchGrad.addColorStop(1, 'rgba(16, 185, 129, 0.5)');
      } else {
        branchGrad.addColorStop(0, 'rgba(52, 211, 153, 0.6)');
        branchGrad.addColorStop(1, 'rgba(190, 242, 100, 0.4)');
      }

      ctx.strokeStyle = branchGrad;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      // Folhas / Flores de Luz nos nós terminais
      if (depth >= maxDepth - 1) {
        const flowerR = (4.5 + Math.sin(t * 3 + depth + startX * 0.01) * 1.5) * pulse;
        const leafAlpha = (0.7 + Math.sin(t * 2.5 + depth) * 0.3) * (isPlaying ? 1 : 0.4);

        ctx.fillStyle = depth === maxDepth 
          ? `rgba(190, 242, 100, ${leafAlpha})` 
          : `rgba(255, 255, 255, ${leafAlpha * 0.9})`;

        ctx.beginPath();
        ctx.arc(endX, endY, flowerR, 0, Math.PI * 2);
        ctx.fill();

        // Aura suave em volta da flor
        ctx.fillStyle = `rgba(16, 185, 129, ${leafAlpha * 0.3})`;
        ctx.beginPath();
        ctx.arc(endX, endY, flowerR * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Bifurcação Harmônica dos Galhos
      const sway = isPlaying ? Math.sin(t * 1.2 + depth * 0.8) * 0.06 : 0;
      const spread = 0.42 + (isPlaying ? Math.cos(t * 0.9) * 0.04 : 0);
      const nextLen = length * 0.72;

      drawFractalBranch(endX, endY, nextLen, angle - spread + sway, depth + 1, maxDepth, pulse);
      drawFractalBranch(endX, endY, nextLen, angle + spread + sway, depth + 1, maxDepth, pulse);
    }

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const treeBaseY = h * 0.88;
      const minDim = Math.min(w, h);
      const trunkLen = minDim * 0.23;

      // 1. Rastro suave com tom verde-floresta sagrado
      ctx.fillStyle = 'rgba(1, 12, 6, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.014; // Ritmo orgânico, relaxante e sereno
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 2. Halo de Glória da Criação (Luz Esmeralda Central)
      const pulse = isPlaying ? (1 + Math.sin(t * 1.6) * 0.07 + Math.cos(t * 2.8) * 0.03) : 1;
      const haloCenterY = h * 0.45;
      const haloR = minDim * 0.45 * pulse;

      const edenGlow = ctx.createRadialGradient(cx, haloCenterY, 5, cx, haloCenterY, haloR);
      edenGlow.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
      edenGlow.addColorStop(0.2, 'rgba(52, 211, 153, 0.35)');
      edenGlow.addColorStop(0.5, 'rgba(16, 185, 129, 0.15)');
      edenGlow.addColorStop(0.8, 'rgba(5, 150, 105, 0.04)');
      edenGlow.addColorStop(1, 'rgba(1, 12, 6, 0)');

      ctx.fillStyle = edenGlow;
      ctx.beginPath();
      ctx.arc(cx, haloCenterY, haloR, 0, Math.PI * 2);
      ctx.fill();

      // 3. Espiral Áurea de Fibonacci / Sol da Vida Eterna
      const numSpiralPoints = 120;
      ctx.strokeStyle = 'rgba(190, 242, 100, 0.35)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();

      const spiralCenterY = h * 0.35;
      for (let i = 0; i < numSpiralPoints; i++) {
        const phi = i * 0.18 + (isPlaying ? t * 0.25 : 0);
        const r = Math.sqrt(i) * (minDim * 0.024) * pulse;
        const sx = cx + Math.cos(phi) * r;
        const sy = spiralCenterY + Math.sin(phi) * r;

        if (i === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      }
      ctx.stroke();

      // Anéis de Renovação e Aliança na Copa
      for (let r = 1; r <= 3; r++) {
        const ringRad = (minDim * 0.14 * r) * pulse;
        const ringAlpha = (0.35 - r * 0.08) * (isPlaying ? 1 : 0.4);

        ctx.strokeStyle = `rgba(52, 211, 153, ${ringAlpha})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (let a = 0; a <= 48; a++) {
          const angle = (a / 48) * Math.PI * 2;
          const wave = isPlaying ? Math.sin(angle * 6 + t * (r % 2 === 0 ? 1.5 : -1.5)) * 6 : 0;
          const rad = ringRad + wave;
          const px = cx + Math.cos(angle) * rad;
          const py = spiralCenterY + Math.sin(angle) * rad;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // 4. Árvore da Vida Fractal
      drawFractalBranch(cx, treeBaseY, trunkLen, -Math.PI / 2, 0, 5, pulse);

      // Raízes de Luz Viva na Base
      const numRoots = 6;
      for (let i = 0; i < numRoots; i++) {
        const rootProgress = i / (numRoots - 1);
        const rootAngle = Math.PI * 0.15 + rootProgress * Math.PI * 0.7;
        const rootLen = minDim * 0.14 * pulse;
        const rEndX = cx + Math.cos(rootAngle) * rootLen;
        const rEndY = treeBaseY + Math.sin(rootAngle) * (rootLen * 0.6);

        const gradRoot = ctx.createLinearGradient(cx, treeBaseY, rEndX, rEndY);
        gradRoot.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
        gradRoot.addColorStop(0.5, 'rgba(16, 185, 129, 0.4)');
        gradRoot.addColorStop(1, 'rgba(5, 150, 105, 0)');

        ctx.strokeStyle = gradRoot;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(cx, treeBaseY);
        ctx.quadraticCurveTo(cx + (rEndX - cx) * 0.5, treeBaseY + 30, rEndX, rEndY);
        ctx.stroke();
      }

      // 5. Vaga-lumes Sagrados & Esporos Bioluminescentes
      fireflies.forEach(p => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.x += Math.sin(t * 1.6 + p.phase) * 0.45;
          if (p.y < -15) {
            p.y = h + 15;
            p.x = Math.random() * w;
          }
        }

        const twinkle = 0.75 + Math.sin(t * 3.2 + p.phase) * 0.25;
        const currentAlpha = p.baseAlpha * twinkle * (isPlaying ? 1 : 0.4);

        ctx.fillStyle = p.isGoldLime 
          ? `rgba(190, 242, 100, ${currentAlpha})` 
          : `rgba(52, 211, 153, ${currentAlpha})`;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        // Brilho difuso em volta dos maiores esporos
        if (p.radius > 1.8) {
          ctx.fillStyle = `rgba(16, 185, 129, ${currentAlpha * 0.35})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 2.8, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
