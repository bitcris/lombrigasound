<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Gospel 3 (Catedral Cósmica & Feixes de Graça)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Gospel 3: Catedral Cósmica & Feixes de Graça
     * 
     * Estética: Fundo preto profundo, feixes de luz volumétrica (God rays), rosácea óptica sagrada e poeira de luz celestial.
     * Paleta: Dourado divino (#fbbf24, #f59e0b), Branco celestial (#ffffff), Âmbar suave (#d97706), Preto absoluto (#000000).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // 🌟 Poeira de Graça (Micropartículas que reagem à luz)
    const NUM_PARTICLES = 65;
    const particles = Array.from({ length: NUM_PARTICLES }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2.2 + 0.8,
      speedY: Math.random() * 0.45 + 0.2,
      driftPhase: Math.random() * Math.PI * 2,
      baseAlpha: Math.random() * 0.6 + 0.3,
      isWhite: Math.random() > 0.4
    }));

    // 🕊️ Feixes Volumétricos de Luz (God Rays)
    const NUM_SHAFTS = 9;
    const lightShafts = Array.from({ length: NUM_SHAFTS }, (_, i) => ({
      angleOffset: ((i - (NUM_SHAFTS - 1) / 2) * 0.13),
      widthFactor: 0.16 + (i % 3) * 0.05,
      speed: 0.35 + Math.random() * 0.25,
      phase: Math.random() * Math.PI * 2
    }));

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h * 0.42;
      const minDim = Math.min(w, h);
      const maxRadius = minDim * 0.30;

      // 1. Fundo preto absoluto com rastro suave
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.015; // Ritmo lento, nobre e contemplativo
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 2. Feixes Volumétricos de Luz (God Rays da Catedral)
      lightShafts.forEach(shaft => {
        const shaftAlpha = (0.07 + Math.sin(t * shaft.speed + shaft.phase) * 0.035) * (isPlaying ? 1 : 0.4);
        const topX = cx + Math.sin(t * 0.18 + shaft.phase) * (w * 0.06);
        const topY = -50;
        const spreadAngle = shaft.angleOffset + Math.sin(t * 0.35 + shaft.phase) * 0.02;
        const bottomLen = h * 1.35;
        const botX = topX + Math.sin(spreadAngle) * bottomLen;
        const botY = topY + Math.cos(spreadAngle) * bottomLen;
        const shaftWidth = (w * shaft.widthFactor);

        const shaftGrad = ctx.createLinearGradient(topX, topY, botX, botY);
        shaftGrad.addColorStop(0, `rgba(255, 255, 240, ${shaftAlpha * 2.0})`);
        shaftGrad.addColorStop(0.3, `rgba(251, 191, 36, ${shaftAlpha * 1.3})`);
        shaftGrad.addColorStop(0.65, `rgba(245, 158, 11, ${shaftAlpha * 0.5})`);
        shaftGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = shaftGrad;
        ctx.beginPath();
        ctx.moveTo(topX - 12, topY);
        ctx.lineTo(topX + 12, topY);
        ctx.lineTo(botX + shaftWidth, botY);
        ctx.lineTo(botX - shaftWidth, botY);
        ctx.closePath();
        ctx.fill();
      });

      // 3. Poeira de Graça Cintilante
      particles.forEach(p => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.x += Math.sin(t + p.driftPhase) * 0.35;
          if (p.y < -10) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
        }

        const twinkle = 0.7 + Math.sin(t * 3.5 + p.driftPhase) * 0.3;
        const currentAlpha = p.baseAlpha * twinkle * (isPlaying ? 1 : 0.4);

        ctx.fillStyle = p.isWhite 
          ? `rgba(255, 255, 255, ${currentAlpha})` 
          : `rgba(251, 191, 36, ${currentAlpha})`;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // 4. Rosácea Óptica da Catedral & Anéis Sagrados
      const pulse = isPlaying ? (1 + Math.sin(t * 1.8) * 0.08) : 1;
      const numRings = 4;

      for (let r = 0; r < numRings; r++) {
        const ringRad = maxRadius * (0.32 + r * 0.22) * pulse;
        const ringAlpha = (0.32 - r * 0.06) * (isPlaying ? 1 : 0.4);
        const points = 72;
        
        ctx.strokeStyle = r % 2 === 0 ? `rgba(251, 191, 36, ${ringAlpha})` : `rgba(254, 240, 138, ${ringAlpha * 0.85})`;
        ctx.lineWidth = r === 0 ? 2.6 : 1.5;
        ctx.beginPath();

        for (let i = 0; i <= points; i++) {
          const theta = (i / points) * Math.PI * 2;
          const harmonic1 = Math.sin(theta * (8 + r * 2) + t * (r % 2 === 0 ? 1.3 : -1.1)) * (isPlaying ? (6 + r * 2) : 2);
          const radiusWithWaves = ringRad + harmonic1;

          const px = cx + Math.cos(theta) * radiusWithWaves;
          const py = cy + Math.sin(theta) * radiusWithWaves;

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // Rosácea Central: 8 Pétalas Entrelaçadas
      const numPetals = 8;
      for (let i = 0; i < numPetals; i++) {
        const angle = (i / numPetals) * Math.PI * 2 + (isPlaying ? t * 0.12 : 0);
        const petalDist = maxRadius * 0.44 * pulse;
        const px = cx + Math.cos(angle) * petalDist;
        const py = cy + Math.sin(angle) * petalDist;
        const pRad = maxRadius * 0.28 * pulse;

        ctx.strokeStyle = 'rgba(254, 240, 138, 0.4)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(px, py, pRad, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 5. Núcleo Radiante & Cruz de Luz
      const coreSize = 32 * pulse;
      const gradCore = ctx.createRadialGradient(cx, cy, 2, cx, cy, coreSize * 2.6);
      gradCore.addColorStop(0, '#ffffff');
      gradCore.addColorStop(0.2, '#fef08a');
      gradCore.addColorStop(0.5, 'rgba(251, 191, 36, 0.75)');
      gradCore.addColorStop(0.8, 'rgba(245, 158, 11, 0.25)');
      gradCore.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = gradCore;
      ctx.beginPath();
      ctx.arc(cx, cy, coreSize * 2.6, 0, Math.PI * 2);
      ctx.fill();

      // Cruz Cardinal Central
      const crossRays = [
        { angle: 0, len: maxRadius * 0.85, w: 2.6 },
        { angle: Math.PI / 2, len: maxRadius * 0.85, w: 2.6 },
        { angle: Math.PI, len: maxRadius * 0.85, w: 2.6 },
        { angle: Math.PI * 1.5, len: maxRadius * 0.85, w: 2.6 },
        { angle: Math.PI / 4, len: maxRadius * 0.44, w: 1.4 },
        { angle: 3 * Math.PI / 4, len: maxRadius * 0.44, w: 1.4 },
        { angle: 5 * Math.PI / 4, len: maxRadius * 0.44, w: 1.4 },
        { angle: 7 * Math.PI / 4, len: maxRadius * 0.44, w: 1.4 }
      ];

      crossRays.forEach(ray => {
        const effAngle = ray.angle + (isPlaying ? Math.sin(t * 0.4) * 0.04 : 0);
        const rayLen = ray.len * (isPlaying ? (0.92 + Math.sin(t * 2.5 + ray.angle) * 0.1) : 0.7);

        const rayGrad = ctx.createLinearGradient(
          cx, cy,
          cx + Math.cos(effAngle) * rayLen,
          cy + Math.sin(effAngle) * rayLen
        );
        rayGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        rayGrad.addColorStop(0.35, 'rgba(251, 191, 36, 0.6)');
        rayGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.strokeStyle = rayGrad;
        ctx.lineWidth = ray.w;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(effAngle) * rayLen, cy + Math.sin(effAngle) * rayLen);
        ctx.stroke();
      });

      // 6. Ondas Polifônicas de Louvor na Base
      const numWaves = 4;
      for (let wIdx = 0; wIdx < numWaves; wIdx++) {
        const waveBaseY = h * 0.82 + (wIdx * 18);
        const waveAlpha = (0.35 - wIdx * 0.07) * (isPlaying ? 1 : 0.35);
        
        ctx.strokeStyle = wIdx % 2 === 0 ? `rgba(251, 191, 36, ${waveAlpha})` : `rgba(254, 240, 138, ${waveAlpha * 0.85})`;
        ctx.lineWidth = 2.0;
        ctx.beginPath();

        for (let x = 0; x <= w; x += 14) {
          const freq = 0.005 + wIdx * 0.002;
          const amp = isPlaying ? (15 + wIdx * 5 + Math.sin(t * 1.8 + wIdx) * 5) : 3;
          const y = waveBaseY + Math.sin(x * freq + t * (1.1 + wIdx * 0.25)) * amp;

          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
