<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Gospel 2 (Pilar de Glória & Fitas Celestiais)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Gospel 2: Pilar de Glória & Fitas Celestiais
     * 
     * Estética: Fundo preto profundo, pilar de ascensão vertical, fitas de luz de ouro líquido e centelhas seráficas.
     * Paleta: Ouro puro (#fbbf24, #f59e0b), Luz celestial (#ffffff), Âmbar quente (#d97706), Preto profundo (#000000).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // 🌌 Estrelas Tênues de Fundo
    const NUM_STARS = 60;
    const stars = Array.from({ length: NUM_STARS }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.5 + 0.25
    }));

    // ✨ Centelhas Seráficas Ascendentes
    const NUM_PARTICLES = 50;
    const particles = Array.from({ length: NUM_PARTICLES }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2.4 + 0.8,
      speedY: Math.random() * 0.55 + 0.25,
      swayPhase: Math.random() * Math.PI * 2,
      alpha: Math.random() * 0.6 + 0.3
    }));

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const haloY = h * 0.28;
      const minDim = Math.min(w, h);

      // 1. Limpeza de fundo em preto absoluto com rastro suave
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.016; // Ritmo lento, sereno e hipnótico
      }

      ctx.save();

      // 2. Estrelas Tênues no Fundo
      stars.forEach(star => {
        ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha * (isPlaying ? 1 : 0.4)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.globalCompositeOperation = 'screen';

      // 3. Pilar de Ascensão de Glória (Feixe Vertical Central)
      const pillarWidth = isPlaying ? (minDim * 0.12 + Math.sin(t * 1.5) * 12) : (minDim * 0.1);
      const pillarGrad = ctx.createLinearGradient(cx - pillarWidth, 0, cx + pillarWidth, 0);
      pillarGrad.addColorStop(0, 'rgba(217, 119, 6, 0)');
      pillarGrad.addColorStop(0.3, 'rgba(245, 158, 11, 0.16)');
      pillarGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.42)');
      pillarGrad.addColorStop(0.7, 'rgba(245, 158, 11, 0.16)');
      pillarGrad.addColorStop(1, 'rgba(217, 119, 6, 0)');

      ctx.fillStyle = pillarGrad;
      ctx.fillRect(cx - pillarWidth * 1.5, 0, pillarWidth * 3, h);

      // Anéis de Ressonância que sobem pelo Pilar
      for (let i = 0; i < 4; i++) {
        const ringProgress = (t * 0.25 + i * 0.25) % 1;
        const ry = h * (1 - ringProgress);
        const rx = cx;
        const ringRadius = (minDim * 0.08) + ringProgress * (minDim * 0.14);
        const ringAlpha = Math.sin(ringProgress * Math.PI) * (isPlaying ? 0.35 : 0.1);

        ctx.strokeStyle = `rgba(254, 240, 138, ${ringAlpha})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(rx, ry, ringRadius, ringRadius * 0.32, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 4. Halo Superior & Coroa de Luz Celestial
      const haloRad = minDim * 0.16;
      const haloPulse = isPlaying ? (1 + Math.sin(t * 2) * 0.08) : 1;
      
      const gradHalo = ctx.createRadialGradient(cx, haloY, 2, cx, haloY, haloRad * 2.2 * haloPulse);
      gradHalo.addColorStop(0, '#ffffff');
      gradHalo.addColorStop(0.2, '#fef08a');
      gradHalo.addColorStop(0.5, 'rgba(251, 191, 36, 0.55)');
      gradHalo.addColorStop(0.8, 'rgba(245, 158, 11, 0.15)');
      gradHalo.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = gradHalo;
      ctx.beginPath();
      ctx.arc(cx, haloY, haloRad * 2.2 * haloPulse, 0, Math.PI * 2);
      ctx.fill();

      // Anéis Acústicos Concêntricos do Halo
      for (let r = 1; r <= 3; r++) {
        const ringRad = haloRad * (0.6 + r * 0.45) * haloPulse;
        const ringAlpha = (0.35 - r * 0.07) * (isPlaying ? 1 : 0.4);
        ctx.strokeStyle = `rgba(254, 240, 138, ${ringAlpha})`;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        for (let a = 0; a <= 64; a++) {
          const angle = (a / 64) * Math.PI * 2;
          const waveDist = isPlaying ? Math.sin(angle * 8 + t * (r % 2 === 0 ? 2 : -2)) * 5 : 0;
          const rad = ringRad + waveDist;
          const rx = cx + Math.cos(angle) * rad;
          const ry = haloY + Math.sin(angle) * rad;
          if (a === 0) ctx.moveTo(rx, ry);
          else ctx.lineTo(rx, ry);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // 5. Fitas de Luz Fluida & Rio de Cristal (Curvas de Bézier na Base)
      const numRibbons = 4;
      for (let i = 0; i < numRibbons; i++) {
        const baseY = h * 0.70 + i * 24;
        const ribbonAlpha = (0.42 - i * 0.08) * (isPlaying ? 1 : 0.35);

        ctx.strokeStyle = i % 2 === 0 ? `rgba(254, 240, 138, ${ribbonAlpha})` : `rgba(251, 191, 36, ${ribbonAlpha * 0.9})`;
        ctx.lineWidth = 2.2;
        ctx.beginPath();

        const segments = 50;
        const stepX = w / segments;

        for (let s = 0; s <= segments; s++) {
          const x = s * stepX;
          const freq1 = 0.005 + i * 0.002;
          const amp1 = isPlaying ? (18 + i * 6 + Math.sin(t * 1.5 + i) * 6) : 3;
          const amp2 = isPlaying ? (8 + Math.cos(t * 2 + s * 0.1) * 4) : 1;
          const wy = baseY + Math.sin(x * freq1 + t * (1.1 + i * 0.25)) * amp1 + Math.cos(x * 0.01 - t * 0.8) * amp2;

          if (s === 0) ctx.moveTo(x, wy);
          else ctx.lineTo(x, wy);
        }
        ctx.stroke();

        // Véu translúcido sob a fita
        ctx.fillStyle = `rgba(245, 158, 11, ${ribbonAlpha * 0.1})`;
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();
      }

      // 6. Centelhas Seráficas Flutuantes
      particles.forEach(p => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.x += Math.sin(t * 1.8 + p.swayPhase) * 0.4;
          if (p.y < -10) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
        }

        const twinkle = 0.75 + Math.sin(t * 3.5 + p.swayPhase) * 0.25;
        const currentAlpha = p.alpha * twinkle * (isPlaying ? 1 : 0.4);

        ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.size > 2.0) {
          ctx.fillStyle = `rgba(251, 191, 36, ${currentAlpha * 0.3})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 2.8, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
