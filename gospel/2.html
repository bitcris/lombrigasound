<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Gospel 2 (Fogo Sagrado & Prisma dos Serafins)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #06010a;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Gospel 2: Fogo Sagrado & Prisma dos Serafins
     * 
     * Tema: A Shekinah, o fogo refinador e as asas dos querubins/serafins em geometria sagrada 3D.
     * Paleta: Púrpura Real (#7e22ce), Magenta Místico (#c026d3), Rubi Flamejante (#f43f5e),
     *         Rosa Quartzo (#f472b6), Branco Resplandecente (#ffffff), Fundo Negro Profundo (#06010a).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // 🔥 Centelhas de Plasma Sagrado (Vórtice Ascendente)
    const NUM_SPARKS = 60;
    const sparks = Array.from({ length: NUM_SPARKS }, () => ({
      angle: Math.random() * Math.PI * 2,
      dist: Math.random() * 260 + 20,
      y: Math.random() * window.innerHeight,
      speedY: Math.random() * 0.6 + 0.3,
      rotSpeed: (Math.random() - 0.5) * 0.03,
      size: Math.random() * 2.5 + 0.8,
      alpha: Math.random() * 0.6 + 0.3,
      isRuby: Math.random() > 0.4
    }));

    // 💎 Vértices de um Octaedro 3D
    const OCTA_VERTICES = [
      [ 0, -1.5,  0],  // Topo
      [ 0,  1.5,  0],  // Base
      [ 1.2,  0,  0],  // Direita
      [-1.2,  0,  0],  // Esquerda
      [ 0,  0,  1.2],  // Frente
      [ 0,  0, -1.2]   // Trás
    ];

    const OCTA_EDGES = [
      [0, 2], [0, 3], [0, 4], [0, 5],
      [1, 2], [1, 3], [1, 4], [1, 5],
      [2, 4], [4, 3], [3, 5], [5, 2]
    ];

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const minDim = Math.min(w, h);
      const scale3D = minDim * 0.17;

      // 1. Rastro suave com tom púrpura ultra profundo
      ctx.fillStyle = 'rgba(6, 1, 10, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.015; // Ritmo solene, poderoso e refinado
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 2. Halo de Glória Shekinah (Fogo Cósmico Violeta & Rubi)
      const pulse = isPlaying ? (1 + Math.sin(t * 1.8) * 0.08 + Math.cos(t * 3.2) * 0.04) : 1;
      const haloR = minDim * 0.42 * pulse;

      const shekinahGlow = ctx.createRadialGradient(cx, cy, 5, cx, cy, haloR);
      shekinahGlow.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
      shekinahGlow.addColorStop(0.2, 'rgba(244, 63, 94, 0.35)');
      shekinahGlow.addColorStop(0.5, 'rgba(192, 38, 211, 0.18)');
      shekinahGlow.addColorStop(0.8, 'rgba(126, 34, 206, 0.05)');
      shekinahGlow.addColorStop(1, 'rgba(6, 1, 10, 0)');

      ctx.fillStyle = shekinahGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, haloR, 0, Math.PI * 2);
      ctx.fill();

      // 3. Asas de Luz dos Serafins (Arcos Harmônicos de Energia Púrpura)
      const numFeathers = 14;
      for (let side = -1; side <= 1; side += 2) {
        for (let i = 0; i < numFeathers; i++) {
          const progress = i / numFeathers;
          const wingSpread = isPlaying ? Math.sin(t * 1.4) * 0.15 : 0;
          const wingAngle = (-Math.PI * 0.45 + progress * Math.PI * 0.8 + wingSpread) * side;
          const wingLen = minDim * (0.24 + progress * 0.22) * pulse;

          const startX = cx + side * (minDim * 0.05);
          const startY = cy + (progress - 0.5) * 50;

          const endX = startX + Math.cos(wingAngle) * wingLen * side;
          const endY = startY + Math.sin(wingAngle) * wingLen;

          const ctrlX = startX + side * (wingLen * 0.65);
          const ctrlY = startY - 80 * (1 - progress);

          const gradWing = ctx.createLinearGradient(startX, startY, endX, endY);
          gradWing.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
          gradWing.addColorStop(0.4, 'rgba(244, 63, 94, 0.45)');
          gradWing.addColorStop(0.8, 'rgba(192, 38, 211, 0.2)');
          gradWing.addColorStop(1, 'rgba(126, 34, 206, 0)');

          ctx.strokeStyle = gradWing;
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
          ctx.stroke();

          // Ponto de luz na ponta de cada pena de fogo
          const sparkAlpha = (0.7 + Math.sin(t * 3 + i) * 0.3) * (isPlaying ? 1 : 0.4);
          ctx.fillStyle = `rgba(255, 255, 255, ${sparkAlpha})`;
          ctx.beginPath();
          ctx.arc(endX, endY, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 4. Prisma Merkaba / Octaedro 3D em Rotação Sagrada
      const rotX = t * 0.4;
      const rotY = t * 0.6;
      const rotZ = t * 0.2;

      // Matriz de rotação 3D
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      const cosZ = Math.cos(rotZ), sinZ = Math.sin(rotZ);

      const projected = OCTA_VERTICES.map(v => {
        let x = v[0], y = v[1], z = v[2];

        // Rotação Y
        let x1 = x * cosY + z * sinY;
        let z1 = -x * sinY + z * cosY;

        // Rotação X
        let y2 = y * cosX - z1 * sinX;
        let z2 = y * sinX + z1 * cosX;

        // Rotação Z
        let x3 = x1 * cosZ - y2 * sinZ;
        let y3 = x1 * sinZ + y2 * cosZ;

        // Perspectiva
        const fov = 3.5;
        const pz = z2 + fov;
        const projX = cx + (x3 / pz) * scale3D * 3.2 * pulse;
        const projY = cy + (y3 / pz) * scale3D * 3.2 * pulse;

        return { x: projX, y: projY, z: z2 };
      });

      // Desenho das arestas do Octaedro
      OCTA_EDGES.forEach(([i1, i2]) => {
        const p1 = projected[i1];
        const p2 = projected[i2];
        const avgZ = (p1.z + p2.z) / 2;
        const edgeAlpha = Math.min(1, Math.max(0.2, (avgZ + 1.8) / 3)) * (isPlaying ? 0.9 : 0.4);

        ctx.strokeStyle = `rgba(244, 114, 182, ${edgeAlpha})`;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        // Linha interna de brilho branco
        ctx.strokeStyle = `rgba(255, 255, 255, ${edgeAlpha * 0.7})`;
        ctx.lineWidth = 1.0;
        ctx.stroke();
      });

      // Vértices brilhantes
      projected.forEach(p => {
        const vAlpha = (0.7 + Math.sin(t * 4 + p.z) * 0.3) * (isPlaying ? 1 : 0.4);
        ctx.fillStyle = `rgba(255, 255, 255, ${vAlpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4.0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(244, 63, 94, ${vAlpha * 0.4})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
        ctx.fill();
      });

      // 5. Coração Rubi Radiante Central (Fonte de Vida)
      const coreR = minDim * 0.07 * pulse;
      const gradCore = ctx.createRadialGradient(cx, cy, 2, cx, cy, coreR * 2.8);
      gradCore.addColorStop(0, '#ffffff');
      gradCore.addColorStop(0.3, '#f472b6');
      gradCore.addColorStop(0.6, 'rgba(244, 63, 94, 0.8)');
      gradCore.addColorStop(0.9, 'rgba(192, 38, 211, 0.2)');
      gradCore.addColorStop(1, 'rgba(6, 1, 10, 0)');

      ctx.fillStyle = gradCore;
      ctx.beginPath();
      ctx.arc(cx, cy, coreR * 2.8, 0, Math.PI * 2);
      ctx.fill();

      // 6. Anéis de Pulso Gravitacional de Glória
      for (let r = 0; r < 3; r++) {
        const ringProg = (t * 0.28 + r * 0.33) % 1;
        const ringR = (minDim * 0.1) + ringProg * (minDim * 0.38);
        const ringAlpha = Math.sin(ringProg * Math.PI) * (isPlaying ? 0.45 : 0.15);

        ctx.strokeStyle = r % 2 === 0 ? `rgba(244, 63, 94, ${ringAlpha})` : `rgba(192, 38, 211, ${ringAlpha})`;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.ellipse(cx, cy, ringR, ringR * 0.45, t * 0.2 + r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 7. Centelhas de Plasma Celestial em Vórtice
      sparks.forEach(p => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.angle += p.rotSpeed;
          if (p.y < -20) {
            p.y = h + 20;
            p.dist = Math.random() * (minDim * 0.4) + 20;
          }
        }

        const sx = cx + Math.cos(p.angle) * p.dist;
        const sy = p.y;

        const twinkle = 0.7 + Math.sin(t * 3.5 + p.angle) * 0.3;
        const currentAlpha = p.alpha * twinkle * (isPlaying ? 1 : 0.4);

        ctx.fillStyle = p.isRuby 
          ? `rgba(244, 63, 94, ${currentAlpha})` 
          : `rgba(244, 114, 182, ${currentAlpha})`;

        ctx.beginPath();
        ctx.arc(sx, sy, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.size > 2.0) {
          ctx.fillStyle = `rgba(192, 38, 211, ${currentAlpha * 0.3})`;
          ctx.beginPath();
          ctx.arc(sx, sy, p.size * 2.8, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
