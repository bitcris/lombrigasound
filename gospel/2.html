<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Gospel 2 (Harpa Celestial & Rios de Águas Vivas)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #02040c;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Gospel 2: Harpa Celestial & Rios de Águas Vivas
     * 
     * Paleta: Dourado imperial (#fbbf24, #f59e0b), Luz celestial (#ffffff), Âmbar quente (#d97706), Índigo sagrado (#030718)
     * Características: Cordas harmônicas ressonantes (harpa), pilar de ascensão espiritual, ondas fluidas de adoração e centelhas seráficas.
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) {
        isPlaying = Boolean(e.data.isPlaying);
      } else if (e.data.playing !== undefined) {
        isPlaying = Boolean(e.data.playing);
      }
      if (e.data.audioData && Array.isArray(e.data.audioData)) {
        audioData = e.data.audioData;
      }
    });

    // ✨ Centelhas Seráficas Ascendentes
    const NUM_PARTICLES = 55;
    const particles = Array.from({ length: NUM_PARTICLES }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2.4 + 0.8,
      speedY: Math.random() * 0.7 + 0.3,
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: Math.random() * 0.02 + 0.015,
      alpha: Math.random() * 0.6 + 0.3,
      isGlint: Math.random() > 0.4
    }));

    // 🎵 Cordas da Harpa Celestial
    const NUM_STRINGS = 20;

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const haloY = h * 0.28;

      // 1. Fundo com rastro suave e atmosfera translúcida
      ctx.fillStyle = 'rgba(2, 4, 12, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.022;
      }

      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      // 2. Pilar de Luz e Glória Central (Ascensão)
      const pillarWidth = isPlaying ? (60 + Math.sin(t * 1.5) * 15) : 50;
      const pillarGrad = ctx.createLinearGradient(cx - pillarWidth, 0, cx + pillarWidth, 0);
      pillarGrad.addColorStop(0, 'rgba(217, 119, 6, 0)');
      pillarGrad.addColorStop(0.3, 'rgba(245, 158, 11, 0.15)');
      pillarGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.35)');
      pillarGrad.addColorStop(0.7, 'rgba(245, 158, 11, 0.15)');
      pillarGrad.addColorStop(1, 'rgba(217, 119, 6, 0)');

      ctx.fillStyle = pillarGrad;
      ctx.fillRect(cx - pillarWidth * 1.5, 0, pillarWidth * 3, h);

      // 3. Cordas da Harpa Celestial Vibrantes
      const stringMargin = w * 0.12;
      const stringSpacing = (w - stringMargin * 2) / (NUM_STRINGS - 1);

      for (let i = 0; i < NUM_STRINGS; i++) {
        const stringX = stringMargin + i * stringSpacing;
        const distFromCenter = Math.abs(stringX - cx) / (w * 0.5);
        const stringAlpha = (0.5 - distFromCenter * 0.3) * (isPlaying ? 1 : 0.3);

        const stringGrad = ctx.createLinearGradient(stringX, 0, stringX, h);
        stringGrad.addColorStop(0, 'rgba(251, 191, 36, 0)');
        stringGrad.addColorStop(0.2, `rgba(254, 240, 138, ${stringAlpha})`);
        stringGrad.addColorStop(0.6, `rgba(245, 158, 11, ${stringAlpha * 0.8})`);
        stringGrad.addColorStop(1, 'rgba(217, 119, 6, 0)');

        ctx.strokeStyle = stringGrad;
        ctx.lineWidth = 1.4;
        ctx.beginPath();

        const segments = 40;
        for (let s = 0; s <= segments; s++) {
          const sy = (s / segments) * h;
          // Harmônicos de vibração da corda
          const vibrationAmp = isPlaying ? (Math.sin(s * 0.3 + t * 4 + i * 0.7) * (7 + Math.sin(t * 2 + i) * 5)) : 0;
          const envelope = Math.sin((s / segments) * Math.PI); // corda fixa nas extremidades
          const sx = stringX + vibrationAmp * envelope;

          if (s === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.stroke();

        // Nós ressonantes (brilhos móveis na corda)
        if (isPlaying && (i % 2 === 0)) {
          const nodeY = (h * 0.35) + Math.sin(t * 2 + i * 0.8) * (h * 0.2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.beginPath();
          ctx.arc(stringX, nodeY, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 4. Coroa de Glória & Halo Superior
      const haloRad = Math.min(w, h) * 0.18;
      const haloPulse = isPlaying ? (1 + Math.sin(t * 2.5) * 0.1) : 1;
      
      const gradHalo = ctx.createRadialGradient(cx, haloY, 2, cx, haloY, haloRad * 1.8 * haloPulse);
      gradHalo.addColorStop(0, '#ffffff');
      gradHalo.addColorStop(0.25, '#fef08a');
      gradHalo.addColorStop(0.55, 'rgba(251, 191, 36, 0.6)');
      gradHalo.addColorStop(0.85, 'rgba(245, 158, 11, 0.2)');
      gradHalo.addColorStop(1, 'rgba(3, 7, 24, 0)');

      ctx.fillStyle = gradHalo;
      ctx.beginPath();
      ctx.arc(cx, haloY, haloRad * 1.8 * haloPulse, 0, Math.PI * 2);
      ctx.fill();

      // Anéis de Ondas Sonoras do Halo
      for (let r = 1; r <= 3; r++) {
        const ringRad = haloRad * (0.6 + r * 0.4) * haloPulse;
        const ringAlpha = (0.4 - r * 0.08) * (isPlaying ? 1 : 0.4);
        ctx.strokeStyle = `rgba(254, 240, 138, ${ringAlpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let a = 0; a <= 60; a++) {
          const angle = (a / 60) * Math.PI * 2;
          const waveDist = isPlaying ? Math.sin(angle * 8 + t * (r % 2 === 0 ? 3 : -3)) * 6 : 0;
          const rad = ringRad + waveDist;
          const rx = cx + Math.cos(angle) * rad;
          const ry = haloY + Math.sin(angle) * rad;
          if (a === 0) ctx.moveTo(rx, ry);
          else ctx.lineTo(rx, ry);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // 5. Rios de Águas Vivas (Ondas Fluidas de Adoração na Base)
      const numWaves = 4;
      for (let i = 0; i < numWaves; i++) {
        const baseY = h * 0.72 + i * 22;
        const waveGrad = ctx.createLinearGradient(0, baseY - 30, 0, h);
        waveGrad.addColorStop(0, `rgba(251, 191, 36, ${0.4 - i * 0.08})`);
        waveGrad.addColorStop(0.5, `rgba(217, 119, 6, ${0.2 - i * 0.04})`);
        waveGrad.addColorStop(1, 'rgba(2, 4, 12, 0)');

        ctx.fillStyle = waveGrad;
        ctx.beginPath();
        ctx.moveTo(0, h);
        ctx.lineTo(0, baseY);

        for (let x = 0; x <= w; x += 12) {
          const freq1 = 0.004 + i * 0.002;
          const freq2 = 0.009;
          const amp1 = isPlaying ? (20 + i * 6 + Math.sin(t * 1.5 + i) * 8) : 4;
          const amp2 = isPlaying ? (10 + Math.cos(t * 2 + x * 0.005) * 5) : 2;
          const wy = baseY + Math.sin(x * freq1 + t * (1.2 + i * 0.3)) * amp1 + Math.cos(x * freq2 - t * 0.8) * amp2;
          ctx.lineTo(x, wy);
        }

        ctx.lineTo(w, h);
        ctx.closePath();
        ctx.fill();

        // Linha de crista luminosa da onda
        ctx.strokeStyle = `rgba(254, 240, 138, ${0.6 - i * 0.12})`;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 12) {
          const freq1 = 0.004 + i * 0.002;
          const freq2 = 0.009;
          const amp1 = isPlaying ? (20 + i * 6 + Math.sin(t * 1.5 + i) * 8) : 4;
          const amp2 = isPlaying ? (10 + Math.cos(t * 2 + x * 0.005) * 5) : 2;
          const wy = baseY + Math.sin(x * freq1 + t * (1.2 + i * 0.3)) * amp1 + Math.cos(x * freq2 - t * 0.8) * amp2;
          if (x === 0) ctx.moveTo(x, wy);
          else ctx.lineTo(x, wy);
        }
        ctx.stroke();
      }

      ctx.restore(); // Restaura modo de mistura

      // 6. Centelhas Seráficas Flutuantes (Elevação da Alma)
      particles.forEach((p) => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.x += Math.sin(t * 2 + p.swayPhase) * 0.45;
          if (p.y < -10) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
        }

        const twinkle = 0.75 + Math.sin(t * 3.5 + p.swayPhase) * 0.25;
        const currentAlpha = p.alpha * twinkle * (isPlaying ? 1 : 0.4);

        ctx.fillStyle = p.isGlint ? `rgba(255, 255, 255, ${currentAlpha})` : `rgba(251, 191, 36, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
