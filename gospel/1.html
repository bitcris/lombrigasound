<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Gospel 1 (Estrela da Manhã & Santuário Cósmico)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Gospel 1: Estrela da Manhã & Santuário Cósmico
     * 
     * Estética: Fundo preto profundo, campo estelar cósmico em paralaxe, geometria sagrada e pulsar divino central.
     * Paleta: Dourado divino (#fbbf24, #f59e0b), Branco resplandecente (#ffffff), Âmbar suave (#d97706), Preto absoluto (#000000).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // 🌌 Campo Estelar Cósmico com Paralaxe
    const NUM_STARS = 75;
    const stars = Array.from({ length: NUM_STARS }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 1.6 + 0.6,
      depth: Math.random() * 0.7 + 0.3,
      alpha: Math.random() * 0.6 + 0.3,
      phase: Math.random() * Math.PI * 2
    }));

    // ✨ Centelhas Celestiais Ascendentes
    const NUM_EMBERS = 40;
    const embers = Array.from({ length: NUM_EMBERS }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2.2 + 0.8,
      speedY: Math.random() * 0.45 + 0.2,
      wobbleSpeed: Math.random() * 0.02 + 0.01,
      phase: Math.random() * Math.PI * 2,
      alpha: Math.random() * 0.6 + 0.3
    }));

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const minDim = Math.min(w, h);
      const baseRadius = minDim * 0.23;

      // 1. Fundo preto absoluto com rastro suave
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.015; // Ritmo lento, cadenciado e hipnótico
      }

      ctx.save();

      // 2. Campo Estelar Cósmico (Profundidade Espacial)
      stars.forEach(star => {
        if (isPlaying) {
          star.y -= 0.15 * star.depth;
          if (star.y < 0) {
            star.y = h;
            star.x = Math.random() * w;
          }
        }
        const twinkle = 0.7 + Math.sin(t * 2 + star.phase) * 0.3;
        const a = star.alpha * twinkle * (isPlaying ? 1 : 0.4);

        ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // 3. Centelhas Celestiais de Glória Flutuantes
      embers.forEach(p => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.x += Math.sin(t * 1.5 + p.phase) * 0.4;
          if (p.y < -10) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
        }
        const a = p.alpha * (0.7 + Math.sin(t * 3 + p.phase) * 0.3) * (isPlaying ? 1 : 0.35);
        ctx.fillStyle = `rgba(251, 191, 36, ${a})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // 4. Efeitos de Iluminação Volumétrica Central (Modo Screen)
      ctx.globalCompositeOperation = 'screen';

      const pulse = isPlaying ? (1 + Math.sin(t * 1.8) * 0.07 + Math.cos(t * 3) * 0.03) : 1;
      const mainRad = baseRadius * pulse;

      // Halo de Glória Cósmica
      const haloGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, minDim * 0.46 * pulse);
      haloGrad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
      haloGrad.addColorStop(0.2, 'rgba(251, 191, 36, 0.3)');
      haloGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.12)');
      haloGrad.addColorStop(0.85, 'rgba(217, 119, 6, 0.04)');
      haloGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = haloGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, minDim * 0.46 * pulse, 0, Math.PI * 2);
      ctx.fill();

      // 5. Geometria Sagrada: Anel de Rosácea com 12 Pétalas em Contra-Rotação
      const numPetals = 12;
      const rotMandala = -t * 0.18;
      ctx.lineWidth = 1.6;

      for (let i = 0; i < numPetals; i++) {
        const petalAngle = (i / numPetals) * Math.PI * 2 + rotMandala;
        const petalDist = mainRad * 0.88;
        const px = cx + Math.cos(petalAngle) * petalDist;
        const py = cy + Math.sin(petalAngle) * petalDist;
        const pRad = mainRad * 0.48 * (isPlaying ? (1 + Math.sin(t * 2 + i) * 0.06) : 1);

        ctx.strokeStyle = i % 2 === 0 ? 'rgba(251, 191, 36, 0.42)' : 'rgba(254, 240, 138, 0.32)';
        ctx.beginPath();
        ctx.arc(px, py, pRad, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 6. Anel de Harmônicos Acústicos
      const points = 72;
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 2.4;
      ctx.beginPath();

      for (let i = 0; i <= points; i++) {
        const theta = (i / points) * Math.PI * 2;
        const wave1 = Math.sin(theta * 8 + t * 2) * (isPlaying ? 10 : 2);
        const wave2 = Math.cos(theta * 16 - t * 2.8) * (isPlaying ? 5 : 1);
        const r = mainRad + wave1 + wave2;

        const x = cx + Math.cos(theta) * r;
        const y = cy + Math.sin(theta) * r;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();

      // Anel da Eternidade (Pontilhado Áureo)
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.55)';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([4, 8]);
      ctx.beginPath();
      ctx.arc(cx, cy, mainRad * 1.32, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 7. Estrela da Manhã Central (Octagrama & Feixes de Glória)
      const starRays = 8;
      for (let i = 0; i < starRays; i++) {
        const angle = (i / starRays) * Math.PI * 2 + (isPlaying ? t * 0.08 : 0);
        const isCardinal = (i % 2 === 0);
        const rayLen = minDim * (isCardinal ? 0.46 : 0.28) * (isPlaying ? (0.92 + Math.sin(t * 2.5 + i) * 0.1) : 0.8);

        const rx = cx + Math.cos(angle) * rayLen;
        const ry = cy + Math.sin(angle) * rayLen;

        const rayGrad = ctx.createLinearGradient(cx, cy, rx, ry);
        rayGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        rayGrad.addColorStop(0.3, 'rgba(254, 240, 138, 0.65)');
        rayGrad.addColorStop(0.6, 'rgba(245, 158, 11, 0.25)');
        rayGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.strokeStyle = rayGrad;
        ctx.lineWidth = isCardinal ? 2.6 : 1.4;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(rx, ry);
        ctx.stroke();
      }

      // Núcleo Radiante (Coração de Luz)
      const coreR = mainRad * 0.38;
      const gradCore = ctx.createRadialGradient(cx, cy, 2, cx, cy, coreR * 2.2);
      gradCore.addColorStop(0, '#ffffff');
      gradCore.addColorStop(0.2, '#fef08a');
      gradCore.addColorStop(0.5, 'rgba(251, 191, 36, 0.8)');
      gradCore.addColorStop(0.8, 'rgba(245, 158, 11, 0.3)');
      gradCore.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = gradCore;
      ctx.beginPath();
      ctx.arc(cx, cy, coreR * 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
