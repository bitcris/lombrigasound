<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Gospel 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050608; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = true;
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
    });

    let t = 0;
    const NUM_RAYS = 24;

    function render() {
      ctx.fillStyle = 'rgba(5, 6, 8, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isPlaying) t += 0.02;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const maxRadius = Math.min(canvas.width, canvas.height) * 0.45;

      // Raios de luz celestial
      for (let i = 0; i < NUM_RAYS; i++) {
        const angle = (i / NUM_RAYS) * Math.PI * 2 + t * 0.5;
        const rayLen = maxRadius * (0.6 + Math.sin(t * 3 + i * 0.8) * (isPlaying ? 0.35 : 0.05));
        
        ctx.strokeStyle = `rgba(251, 191, 36, ${0.15 + (Math.sin(t * 2 + i) * 0.1)})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * rayLen, cy + Math.sin(angle) * rayLen);
        ctx.stroke();
      }

      // Sol / Núcleo Dourado
      const corePulse = (isPlaying ? Math.sin(t * 2.5) * 15 : 0);
      const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 60 + corePulse);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, '#fef08a');
      grad.addColorStop(0.7, 'rgba(245, 158, 11, 0.8)');
      grad.addColorStop(1, 'rgba(217, 119, 6, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, 65 + corePulse, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
