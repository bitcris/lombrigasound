<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Gospel 1 (Mandala Sagrada & Resplendor Dourado)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #020307;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Gospel 1: Mandala Sagrada & Resplendor Dourado
     * 
     * Paleta: Dourado divino (#fbbf24, #f59e0b), Branco celestial (#ffffff), Âmbar sagrado (#d97706)
     * Características: Mandala de geometria sagrada, raios de sol celestial, halo pulsante e centelhas flutuantes.
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) {
        isPlaying = Boolean(e.data.isPlaying);
      } else if (e.data.playing !== undefined) {
        isPlaying = Boolean(e.data.playing);
      }
      if (e.data.audioData && Array.isArray(e.data.audioData)) {
        audioData = e.data.audioData;
      }
    });

    // ✨ Sistema de Centelhas Celestiais
    const NUM_PARTICLES = 50;
    const particles = Array.from({ length: NUM_PARTICLES }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2.2 + 0.8,
      speedY: Math.random() * 0.5 + 0.2,
      wobbleSpeed: Math.random() * 0.03 + 0.01,
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleAmp: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.6 + 0.3,
      isWhite: Math.random() > 0.6
    }));

    // Raios do Sol Celestial
    const NUM_RAYS = 32;
    const rayVariations = Array.from({ length: NUM_RAYS }, (_, i) => ({
      baseLen: 0.65 + (i % 3 === 0 ? 0.35 : i % 2 === 0 ? 0.2 : 0.05),
      width: i % 3 === 0 ? 2.5 : i % 2 === 0 ? 1.8 : 1.0,
      phase: i * (Math.PI * 2 / NUM_RAYS)
    }));

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const minDim = Math.min(w, h);
      const baseRadius = minDim * 0.23;

      // 1. Limpeza de fundo com rastro suave (motion blur)
      ctx.fillStyle = 'rgba(2, 3, 7, 0.22)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.02;
      }

      const pulse = isPlaying ? (1 + Math.sin(t * 2) * 0.08 + Math.cos(t * 3.5) * 0.04) : 1;
      const mainRad = baseRadius * pulse;

      // 2. Centelhas Flutuantes (Ascensão de Bênçãos)
      particles.forEach((p) => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.x += Math.sin(t * 2 + p.wobblePhase) * p.wobbleAmp * 0.25;
          if (p.y < -10) {
            p.y = h + 10;
            p.x = Math.random() * w;
          }
        }

        const twinkle = 0.7 + Math.sin(t * 4 + p.wobblePhase) * 0.3;
        const currentAlpha = p.alpha * twinkle * (isPlaying ? 1 : 0.35);

        ctx.fillStyle = p.isWhite ? `rgba(255, 255, 255, ${currentAlpha})` : `rgba(251, 191, 36, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.size > 2.0) {
          ctx.fillStyle = `rgba(245, 158, 11, ${currentAlpha * 0.25})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 2.8, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // 3. Resplendor / Raios do Sol Celestial
      ctx.save();
      ctx.globalCompositeOperation = 'screen';

      for (let i = 0; i < NUM_RAYS; i++) {
        const ray = rayVariations[i];
        const rot = t * 0.15;
        const angle = ray.phase + rot;
        const wave = isPlaying ? Math.sin(t * 3 + i * 0.5) * 0.12 : 0;
        const rayLen = minDim * 0.44 * (ray.baseLen + wave);

        const x2 = cx + Math.cos(angle) * rayLen;
        const y2 = cy + Math.sin(angle) * rayLen;

        const rayGrad = ctx.createLinearGradient(cx, cy, x2, y2);
        rayGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        rayGrad.addColorStop(0.2, 'rgba(254, 240, 138, 0.7)');
        rayGrad.addColorStop(0.55, 'rgba(245, 158, 11, 0.35)');
        rayGrad.addColorStop(1, 'rgba(180, 83, 9, 0)');

        ctx.strokeStyle = rayGrad;
        ctx.lineWidth = ray.width;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      // 4. Geometria Sagrada: Pétalas de Rosácea / Mandala Rotativa
      const numPetals = 12;
      ctx.lineWidth = 1.8;
      for (let i = 0; i < numPetals; i++) {
        const petalAngle = (i / numPetals) * Math.PI * 2 - t * 0.25;
        const petalDist = mainRad * 0.85;
        const px = cx + Math.cos(petalAngle) * petalDist;
        const py = cy + Math.sin(petalAngle) * petalDist;
        const petalRadius = mainRad * 0.52 * (isPlaying ? (1 + Math.sin(t * 3 + i) * 0.08) : 1);

        ctx.strokeStyle = i % 2 === 0 ? 'rgba(251, 191, 36, 0.45)' : 'rgba(254, 240, 138, 0.35)';
        ctx.beginPath();
        ctx.arc(px, py, petalRadius, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 5. Anel de Harmônicos de Louvor
      const points = 80;
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 2.5;
      ctx.beginPath();

      for (let i = 0; i <= points; i++) {
        const theta = (i / points) * Math.PI * 2;
        const wave1 = Math.sin(theta * 8 + t * 2.5) * (isPlaying ? 14 : 2);
        const wave2 = Math.cos(theta * 16 - t * 3.5) * (isPlaying ? 7 : 1);
        const wave3 = Math.sin(theta * 4 + t * 1.2) * (isPlaying ? 10 : 0);
        const r = mainRad + wave1 + wave2 + wave3;

        const x = cx + Math.cos(theta) * r;
        const y = cy + Math.sin(theta) * r;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();

      // Anel Externo Dourado Pontilhado (Símbolo da Eternidade)
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 8]);
      ctx.beginPath();
      ctx.arc(cx, cy, mainRad * 1.35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]); // Reset dash

      // 6. Núcleo Dourado Divino (Luz Incessante)
      const coreRadius = mainRad * 0.45;
      const gradCore = ctx.createRadialGradient(cx, cy, 2, cx, cy, coreRadius * 2.2);
      gradCore.addColorStop(0, '#ffffff');
      gradCore.addColorStop(0.2, '#fef08a');
      gradCore.addColorStop(0.45, 'rgba(251, 191, 36, 0.85)');
      gradCore.addColorStop(0.75, 'rgba(245, 158, 11, 0.4)');
      gradCore.addColorStop(1, 'rgba(217, 119, 6, 0)');

      ctx.fillStyle = gradCore;
      ctx.beginPath();
      ctx.arc(cx, cy, coreRadius * 2.2, 0, Math.PI * 2);
      ctx.fill();

      // 7. Cruz de Glória Central (Brilho Cruciforme)
      const crossLen = mainRad * 0.9;
      const crossGradH = ctx.createLinearGradient(cx - crossLen, cy, cx + crossLen, cy);
      crossGradH.addColorStop(0, 'rgba(255, 255, 255, 0)');
      crossGradH.addColorStop(0.5, 'rgba(255, 255, 255, 0.95)');
      crossGradH.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.strokeStyle = crossGradH;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - crossLen, cy);
      ctx.lineTo(cx + crossLen, cy);
      ctx.stroke();

      const crossGradV = ctx.createLinearGradient(cx, cy - crossLen * 1.2, cx, cy + crossLen * 1.2);
      crossGradV.addColorStop(0, 'rgba(255, 255, 255, 0)');
      crossGradV.addColorStop(0.5, 'rgba(255, 255, 255, 0.95)');
      crossGradV.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.strokeStyle = crossGradV;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx, cy - crossLen * 1.2);
      ctx.lineTo(cx, cy + crossLen * 1.2);
      ctx.stroke();

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
