<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lombrigasound - Gospel 1 (Águas Vivas & Aurora Celestial)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #010a12;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    /**
     * Lombrigasound - Gospel 1: Águas Vivas & Aurora Celestial
     * 
     * Tema: O mar de cristal, águas vivas e a aurora da redenção.
     * Paleta: Ciano Elétrico (#00f0ff), Azul Celeste (#38bdf8), Azul Profundo (#0284c7),
     *         Branco Diamante (#ffffff), Gelo (#e0f2fe), Fundo Preto Oceânico (#010a12).
     */

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 📡 Listener Obrigatório de postMessage
    let isPlaying = true;
    let audioData = null;

    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.isPlaying !== undefined) isPlaying = Boolean(e.data.isPlaying);
      else if (e.data.playing !== undefined) isPlaying = Boolean(e.data.playing);
      if (e.data.audioData && Array.isArray(e.data.audioData)) audioData = e.data.audioData;
    });

    // 💧 Gotas e Pérolas de Luz Viva
    const NUM_DROPS = 55;
    const droplets = Array.from({ length: NUM_DROPS }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 2.4 + 0.8,
      speedY: Math.random() * 0.45 + 0.2,
      swayFreq: Math.random() * 0.02 + 0.01,
      swayAmp: Math.random() * 25 + 10,
      phase: Math.random() * Math.PI * 2,
      alpha: Math.random() * 0.6 + 0.3
    }));

    // 🌊 Ondas de Luz Cáustica
    const NUM_WAVE_LAYERS = 5;

    let t = 0;

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h * 0.45;
      const minDim = Math.min(w, h);
      const orbRadius = minDim * 0.16;

      // 1. Rastro suave com tom azul-marinho ultra profundo
      ctx.fillStyle = 'rgba(1, 10, 18, 0.24)';
      ctx.fillRect(0, 0, w, h);

      if (isPlaying) {
        t += 0.014; // Ritmo fluido, meditativo e suave
      }

      ctx.save();

      // 2. Aurora Celestial Superior (Vento do Espírito)
      ctx.globalCompositeOperation = 'screen';

      for (let a = 0; a < 3; a++) {
        const auroraY = h * 0.18 + a * 35;
        const gradAurora = ctx.createLinearGradient(0, 0, w, h * 0.4);
        gradAurora.addColorStop(0, 'rgba(0, 240, 255, 0)');
        gradAurora.addColorStop(0.5, a === 1 ? 'rgba(56, 189, 248, 0.15)' : 'rgba(14, 165, 233, 0.1)');
        gradAurora.addColorStop(1, 'rgba(0, 240, 255, 0)');

        ctx.fillStyle = gradAurora;
        ctx.beginPath();
        ctx.moveTo(0, 0);

        for (let x = 0; x <= w; x += 20) {
          const wave1 = Math.sin(x * 0.003 + t * (0.8 + a * 0.3) + a) * 45;
          const wave2 = Math.cos(x * 0.007 - t * 0.5) * 20;
          ctx.lineTo(x, auroraY + wave1 + wave2);
        }

        ctx.lineTo(w, 0);
        ctx.closePath();
        ctx.fill();
      }

      // 3. Orbe Central de Água Cristalina & Fonte Sagrada
      const pulse = isPlaying ? (1 + Math.sin(t * 1.6) * 0.07 + Math.cos(t * 2.8) * 0.03) : 1;
      const currentOrbR = orbRadius * pulse;

      // Halo Luminoso de Refração
      const orbGlow = ctx.createRadialGradient(cx, cy, 2, cx, cy, currentOrbR * 3.2);
      orbGlow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      orbGlow.addColorStop(0.2, 'rgba(0, 240, 255, 0.6)');
      orbGlow.addColorStop(0.5, 'rgba(56, 189, 248, 0.25)');
      orbGlow.addColorStop(0.8, 'rgba(2, 132, 199, 0.08)');
      orbGlow.addColorStop(1, 'rgba(1, 10, 18, 0)');

      ctx.fillStyle = orbGlow;
      ctx.beginPath();
      ctx.arc(cx, cy, currentOrbR * 3.2, 0, Math.PI * 2);
      ctx.fill();

      // Anéis de Ressonância Líquida (Ondulações Concêntricas)
      for (let r = 1; r <= 4; r++) {
        const ringProg = (t * 0.25 + r * 0.25) % 1;
        const ringR = currentOrbR * (0.8 + ringProg * 2.2);
        const ringAlpha = Math.sin(ringProg * Math.PI) * (isPlaying ? 0.4 : 0.15);

        ctx.strokeStyle = `rgba(186, 230, 253, ${ringAlpha})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        
        const segments = 64;
        for (let s = 0; s <= segments; s++) {
          const angle = (s / segments) * Math.PI * 2;
          const deform = isPlaying ? Math.sin(angle * 6 + t * 2 + r) * 4 : 0;
          const rad = ringR + deform;
          const px = cx + Math.cos(angle) * rad;
          const py = cy + Math.sin(angle) * rad;

          if (s === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }

      // Geometria Sagrada da Fonte: Mandala de Pétalas Líquidas (8 eixos)
      const numRays = 8;
      for (let i = 0; i < numRays; i++) {
        const angle = (i / numRays) * Math.PI * 2 + (isPlaying ? t * 0.1 : 0);
        const rayLen = currentOrbR * 1.7;
        const rx = cx + Math.cos(angle) * rayLen;
        const ry = cy + Math.sin(angle) * rayLen;

        const gradRay = ctx.createLinearGradient(cx, cy, rx, ry);
        gradRay.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        gradRay.addColorStop(0.5, 'rgba(0, 240, 255, 0.4)');
        gradRay.addColorStop(1, 'rgba(0, 240, 255, 0)');

        ctx.strokeStyle = gradRay;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(rx, ry);
        ctx.stroke();

        // Arcos entrelaçados
        const nextAngle = ((i + 1) / numRays) * Math.PI * 2 + (isPlaying ? t * 0.1 : 0);
        const midAngle = (angle + nextAngle) / 2;
        const arcR = currentOrbR * 1.35;
        const mx = cx + Math.cos(midAngle) * arcR;
        const my = cy + Math.sin(midAngle) * arcR;

        ctx.strokeStyle = 'rgba(125, 211, 252, 0.35)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.quadraticCurveTo(mx, my, cx + Math.cos(nextAngle) * rayLen, cy + Math.sin(nextAngle) * rayLen);
        ctx.stroke();
      }

      // Núcleo Radiante de Luz Pura
      const coreR = currentOrbR * 0.45;
      const gradCore = ctx.createRadialGradient(cx, cy, 1, cx, cy, coreR);
      gradCore.addColorStop(0, '#ffffff');
      gradCore.addColorStop(0.4, '#e0f2fe');
      gradCore.addColorStop(0.8, '#38bdf8');
      gradCore.addColorStop(1, 'rgba(0, 240, 255, 0)');

      ctx.fillStyle = gradCore;
      ctx.beginPath();
      ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
      ctx.fill();

      // 4. Mar de Cristal / Camadas de Ondas Polifônicas Inferiores
      for (let wIdx = 0; wIdx < NUM_WAVE_LAYERS; wIdx++) {
        const baseY = h * 0.65 + wIdx * 28;
        const waveAlpha = (0.45 - wIdx * 0.07) * (isPlaying ? 1 : 0.4);
        const color = wIdx % 2 === 0 ? `rgba(0, 240, 255, ${waveAlpha})` : `rgba(56, 189, 248, ${waveAlpha * 0.9})`;

        ctx.strokeStyle = color;
        ctx.lineWidth = 2.2;
        ctx.beginPath();

        const stepX = 16;
        for (let x = 0; x <= w + stepX; x += stepX) {
          const freq1 = 0.004 + wIdx * 0.0015;
          const freq2 = 0.009;
          const amp1 = isPlaying ? (20 + wIdx * 6 + Math.sin(t * 1.5 + wIdx) * 6) : 4;
          const amp2 = isPlaying ? (8 + Math.cos(t * 2.2 + x * 0.005) * 4) : 1;
          const wy = baseY + Math.sin(x * freq1 + t * (1.2 + wIdx * 0.2)) * amp1 + Math.cos(x * freq2 - t * 0.8) * amp2;

          if (x === 0) ctx.moveTo(x, wy);
          else ctx.lineTo(x, wy);
        }
        ctx.stroke();

        // Preenchimento translúcido sob as ondas
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fillStyle = `rgba(2, 132, 199, ${waveAlpha * 0.08})`;
        ctx.fill();
      }

      // 5. Gotas / Orvalho Celeste em Ascensão
      droplets.forEach(p => {
        if (isPlaying) {
          p.y -= p.speedY;
          p.x += Math.sin(t * 1.5 + p.phase) * 0.45;
          if (p.y < -15) {
            p.y = h + 15;
            p.x = Math.random() * w;
          }
        }

        const twinkle = 0.75 + Math.sin(t * 3 + p.phase) * 0.25;
        const currentAlpha = p.alpha * twinkle * (isPlaying ? 1 : 0.4);

        ctx.fillStyle = `rgba(224, 242, 254, ${currentAlpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();

        // Brilho difuso em gotas maiores
        if (p.radius > 1.8) {
          ctx.fillStyle = `rgba(0, 240, 255, ${currentAlpha * 0.35})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 2.8, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
